# One-command demo: gateway + state DB + seeded Postgres target + a dev-only
# service account, so no IdP is needed. Loopback only, plain HTTP — a demo,
# never a deployment (that is examples/docker-compose.yml).
#
#   cd examples/demo && docker compose up -d --wait
#   docker compose run --rm ready   # prints the `claude mcp add …` line
#
# Then ask Claude: "list the servers you can see, then the 5 latest orders".
#
# SSO path (Dex, static user dev@example.com / dev-only-password, group
# `devs`): `docker compose --profile sso up -d --wait`, then add the gateway without
# the Authorization header and sign in from Claude Code's /mcp.
#
# Variables (all optional):
#   DEMO_PORT      host port for the gateway (default 8443). The SSO profile
#                  needs 8443: it is the redirect URI config/dex.yaml registers.
#   GATEWAY_IMAGE  gateway image (default the pinned release below; a local
#                  build: GATEWAY_IMAGE=db-mcp-gateway:dev)
#
# Teardown: `docker compose --profile sso down -v` (drops the data and the token).

name: db-mcp-gateway-demo

services:
  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/developerz-ai/db-mcp-gateway:2.6.3}
    environment:
      DB_MCP_GATEWAY_CONFIG: /etc/gateway/config.yml
      RUST_LOG: info
      STATE_DB_URL: postgres://gateway:demo-state-only@state-db:5432/gateway
      DEMO_RO_PASSWORD: demo-ro-only
      # Published on 127.0.0.1 only (ports below), so plain HTTP never leaves the box.
      TLS_DISABLED: "true"
      # Dex shares this container's network namespace (profile `sso`), so the
      # loopback issuer resolves both here and in the browser. Without the
      # profile it is never contacted: service-token calls need no IdP.
      OIDC_ISSUER: http://localhost:5556
      OIDC_CLIENT_ID: dev
      OIDC_CLIENT_SECRET: dev-only-oidc-secret
      OIDC_REDIRECT_URL: http://localhost:${DEMO_PORT:-8443}/auth/callback
    # SESSION_SIGNING_KEY is random per demo project, minted by `mint-token`
    # (this container binds 0.0.0.0, where a public key would let any compose
    # peer forge sessions). The gateway reads it from the environment only and
    # the distroless image has no shell, so mint-token also drops its static
    # busybox into the volume and this entrypoint loads the key with the
    # shell's own `read`: never on a command line, in `docker inspect`, or a log.
    entrypoint:
      - /run/demo-secrets/busybox
      - sh
      - -euc
      - |
        read -r SESSION_SIGNING_KEY < /run/demo-secrets/session-signing-key
        export SESSION_SIGNING_KEY
        exec /usr/local/bin/db-mcp-gateway
    ports:
      - "127.0.0.1:${DEMO_PORT:-8443}:8443"
    volumes:
      - ./gateway.yaml:/etc/gateway/config.yml:ro
      - demo-secrets:/run/demo-secrets:ro
    depends_on:
      state-db:
        condition: service_healthy
      target-db:
        condition: service_healthy
      mint-token:
        condition: service_completed_successfully
    # The distroless image has no wget: the probe runs mint-token's busybox
    # from the volume, so `up --wait` returns once /healthz answers.
    healthcheck:
      test: ["CMD", "/run/demo-secrets/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8443/healthz"]
      interval: 2s
      timeout: 3s
      retries: 60

  state-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: demo-state-only
      POSTGRES_DB: gateway
    volumes:
      - state-db-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first-boot init the image runs a temporary server on
      # the unix socket only, which a socket probe would call ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gateway -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 30

  target-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop_owner
      POSTGRES_PASSWORD: demo-owner-only
      POSTGRES_DB: shop
      DEMO_RO_PASSWORD: demo-ro-only
    volumes:
      - target-db-data:/var/lib/postgresql/data
      - ./init-target.sh:/docker-entrypoint-initdb.d/init-target.sh:ro
      - ./seed.sql:/demo/seed.sql:ro
    healthcheck:
      # Ready once the init script has created the gateway's role, asked over
      # TCP: the temporary init server listens on the unix socket only.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U shop_owner -d shop -tAc \"SELECT 1 FROM pg_roles WHERE rolname = 'mcp_demo_ro'\" | grep -qx 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Mints the dev-only service token (same shape as bin/mint-service-token) and
  # the session signing key once, into a volume only the gateway and `ready`
  # mount, plus the busybox the gateway's entrypoint runs.
  mint-token:
    image: busybox:1.38.0-musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
    volumes:
      - demo-secrets:/run/demo-secrets
    command:
      - sh
      - -euc
      - |
        cd /run/demo-secrets
        umask 077
        hex32() { head -c 32 /dev/urandom | od -An -vtx1 | tr -d ' \n'; }
        # Whole or absent: a file cut short (a crash mid-write, a failed
        # read of /dev/urandom) is re-minted, never reused. Written to a temp
        # file, checked for its exact size and shape, then renamed into place.
        # The values never reach stdout.
        intact() { [ "$$(wc -c < "$$1")" -eq "$$2" ] && grep -qxE "$$3" "$$1"; }
        mint() {
          intact "$$1" "$$2" "$$3" 2>/dev/null && return 0
          printf "$$4" "$$(hex32)" > "$$1.new"
          intact "$$1.new" "$$2" "$$3" || { rm -f "$$1.new"; echo "mint-token: minted $$1 is malformed" >&2; exit 1; }
          mv -f "$$1.new" "$$1"
        }
        mint service-token 74 'dbmcp_svc_[0-9a-f]{64}' 'dbmcp_svc_%s'
        mint session-signing-key 65 '[0-9a-f]{64}' '%s\n'
        chown 65532:65532 service-token session-signing-key   # the image's nonroot user
        chmod 0400 service-token session-signing-key
        cp /bin/busybox busybox.new && chmod 0555 busybox.new && mv -f busybox.new busybox

  # Prints the one line to paste: `docker compose run --rm ready`. A one-shot
  # under its own profile, so `up --wait` never races its exit.
  ready:
    image: busybox:1.38.0-musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
    profiles: ["ready"]
    environment:
      DEMO_PORT: ${DEMO_PORT:-8443}
    volumes:
      - demo-secrets:/run/demo-secrets:ro
    depends_on:
      gateway:
        condition: service_healthy
    command:
      - sh
      - -euc
      - |
        echo
        echo 'Gateway is up. Add it to Claude Code (dev-only token):'
        echo
        echo "  claude mcp add --transport http demo-db http://localhost:$$DEMO_PORT/mcp --header \"Authorization: Bearer $$(cat /run/demo-secrets/service-token)\""
        echo

  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    profiles: ["sso"]
    network_mode: "service:gateway"
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ../../config/dex.yaml:/etc/dex/config.yaml:ro

  # Publishes Dex to the browser at the same http://localhost:5556. Dex lives
  # in the gateway's namespace, whose ports exist in every profile; this relay
  # keeps 5556 unreserved unless `sso` is on. The digest pins a busybox whose
  # `nc -lk -e` is a persistent server (one forked relay per connection);
  # tests/bin/demo.test.sh reaches Dex through it, connection after connection.
  dex-port:
    image: busybox:1.38.0-musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
    profiles: ["sso"]
    depends_on:
      dex:
        condition: service_started
    ports:
      - "127.0.0.1:5556:5556"
    command: ["nc", "-lk", "-p", "5556", "-e", "nc", "gateway", "5556"]

volumes:
  state-db-data:
  target-db-data:
  demo-secrets:
