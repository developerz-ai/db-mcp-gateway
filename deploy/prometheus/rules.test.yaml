# `promtool test rules deploy/prometheus/rules.test.yaml`: the audit-failure
# alerts fire on a steady increase and on the gauge the gateway holds at 1
# after a failure (`audit_failure_recent`), so a failure before a pod's first
# scrape shows while the hold lasts; they clear with the gauge, stay quiet on a
# flat 0, on a long-lived pod's old count after a scrape outage, and after a
# restart drops the hold. The reaper and pruner staleness alerts are per
# deployment, even for two releases in one job.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      # Pods scraped from boot, all at 0: quiet.
      - series: 'tool_calls{tool="run_query",outcome="audit_unavailable",access="read",job="gw",instance="quiet"}'
        values: '0x40'
      - series: 'audit_fallback_failures_total{job="gw",instance="quiet"}'
        values: '0x40'
      - series: 'audit_failure_recent{kind="write",job="gw",instance="quiet"}'
        values: '0x40'
      - series: 'audit_failure_recent{kind="fallback",job="gw",instance="quiet"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 30m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 5m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
      - eval_time: 30m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
  - interval: 1m
    input_series:
      # Failed at 10m, first scraped at 24m with the counters already above 0:
      # fires on that scrape, resolves with the holds (25m and 40m).
      - series: 'tool_calls{tool="run_query",outcome="audit_unavailable",access="read",job="gw",instance="late"}'
        values: '_x24 1x40'
      - series: 'audit_fallback_failures_total{job="gw",instance="late"}'
        values: '_x24 1x40'
      - series: 'audit_failure_recent{kind="write",job="gw",instance="late"}'
        values: '_x24 1 0x40'
      - series: 'audit_failure_recent{kind="fallback",job="gw",instance="late"}'
        values: '_x24 1x15 0x30'
    alert_rule_test:
      - eval_time: 23m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 24m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 15m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
      - eval_time: 25m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 30m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 23m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
      - eval_time: 24m
        alertname: GatewayAuditFallbackFailures
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Disconnect-path audit writes failed.
              description: 'Disconnect-path audit writes failed in the last 30m; those calls are recorded only once the reaper marks them abandoned.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditfallbackfailures
      - eval_time: 39m
        alertname: GatewayAuditFallbackFailures
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Disconnect-path audit writes failed.
              description: 'Disconnect-path audit writes failed in the last 30m; those calls are recorded only once the reaper marks them abandoned.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditfallbackfailures
      - eval_time: 40m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
      - eval_time: 45m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
  - interval: 1m
    input_series:
      # The same late pod with its wall clock 10m fast and another's 1h slow: the
      # alerts read no clock, so nothing moves.
      - series: 'audit_failure_recent{kind="write",job="gw",instance="fast"}'
        values: '_x24 1 0x40'
      - series: 'audit_failure_recent{kind="fallback",job="gw",instance="fast"}'
        values: '_x24 1x15 0x30'
      - series: 'process_start_time_seconds{job="gw",instance="fast"}'
        values: '_x24 1200x41'
      - series: 'audit_failure_recent{kind="write",job="gw",instance="slow"}'
        values: '0x65'
      - series: 'audit_failure_recent{kind="fallback",job="gw",instance="slow"}'
        values: '0x65'
      - series: 'process_start_time_seconds{job="gw",instance="slow"}'
        values: '-3600x65'
    alert_rule_test:
      - eval_time: 24m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 15m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
      - eval_time: 25m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 30m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 39m
        alertname: GatewayAuditFallbackFailures
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Disconnect-path audit writes failed.
              description: 'Disconnect-path audit writes failed in the last 30m; those calls are recorded only once the reaper marks them abandoned.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditfallbackfailures
      - eval_time: 40m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
      - eval_time: 45m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
  - interval: 1m
    input_series:
      # One failure at 10m on a scraped pod, gauges only: resolve boundaries. The
      # write hold ends at 25m, re-armed at 50m it ends at 65m.
      - series: 'audit_failure_recent{kind="write",job="gw",instance="a"}'
        values: '0x9 1x14 0x24 1x14 0x20'
      - series: 'audit_failure_recent{kind="fallback",job="gw",instance="a"}'
        values: '0x9 1x29 0x44'
      - series: 'audit_failure_recent{kind="write",job="gw",instance="b"}'
        values: '0x80'
      - series: 'audit_failure_recent{kind="fallback",job="gw",instance="b"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 9m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 10m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 15m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
      - eval_time: 24m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 15m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
      - eval_time: 25m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 49m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 50m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 15m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
      - eval_time: 64m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 15m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
      - eval_time: 65m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 9m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
      - eval_time: 10m
        alertname: GatewayAuditFallbackFailures
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Disconnect-path audit writes failed.
              description: 'Disconnect-path audit writes failed in the last 30m; those calls are recorded only once the reaper marks them abandoned.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditfallbackfailures
      - eval_time: 39m
        alertname: GatewayAuditFallbackFailures
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Disconnect-path audit writes failed.
              description: 'Disconnect-path audit writes failed in the last 30m; those calls are recorded only once the reaper marks them abandoned.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditfallbackfailures
      - eval_time: 40m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
  - interval: 1m
    input_series:
      # A container restart at 14m drops the hold of a failure at 10m; the
      # counters restart at 0, and increase() ends with its own lookback.
      - series: 'audit_failure_recent{kind="write",job="gw",instance="r"}'
        values: '0x9 1x3 0x40'
      - series: 'audit_failure_recent{kind="fallback",job="gw",instance="r"}'
        values: '0x9 1x3 0x40'
      - series: 'tool_calls{tool="run_query",outcome="audit_unavailable",access="read",job="gw",instance="r"}'
        values: '0x9 1x3 0x40'
      - series: 'audit_fallback_failures_total{job="gw",instance="r"}'
        values: '0x9 1x3 0x40'
    alert_rule_test:
      - eval_time: 13m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 15m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
      - eval_time: 16m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 13m
        alertname: GatewayAuditFallbackFailures
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Disconnect-path audit writes failed.
              description: 'Disconnect-path audit writes failed in the last 30m; those calls are recorded only once the reaper marks them abandoned.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditfallbackfailures
      - eval_time: 26m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
  - interval: 1m
    input_series:
      # A scraped pod replaced at 13m (its series end): increase() still fires
      # for its lookback, the replacement at 0 does not.
      - series: 'audit_failure_recent{kind="write",job="gw",instance="gone"}'
        values: '0x9 1x2 stale'
      - series: 'tool_calls{tool="run_query",outcome="audit_unavailable",access="read",job="gw",instance="gone"}'
        values: '0x9 1x2 stale'
      - series: 'audit_failure_recent{kind="write",job="gw",instance="next"}'
        values: '_x13 0x30'
      - series: 'tool_calls{tool="run_query",outcome="audit_unavailable",access="read",job="gw",instance="next"}'
        values: '_x13 0x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 15m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
      - eval_time: 13m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 15m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
      - eval_time: 16m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
  - interval: 1m
    input_series:
      # Counter clause alone: a step from 0 to 3 with no gauge (an older image).
      - series: 'tool_calls{tool="run_query",outcome="audit_unavailable",access="read",job="gw",instance="old-image"}'
        values: '0x10 3x10'
      - series: 'audit_fallback_failures_total{job="gw",instance="old-image"}'
        values: '0x10 3x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 12m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 15m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
      - eval_time: 18m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 9m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
      - eval_time: 12m
        alertname: GatewayAuditFallbackFailures
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Disconnect-path audit writes failed.
              description: 'Disconnect-path audit writes failed in the last 30m; those calls are recorded only once the reaper marks them abandoned.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditfallbackfailures
      - eval_time: 28m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
  - interval: 1m
    input_series:
      # A long-lived pod with old failures, unscraped from 11m to 30m: its counts
      # are history, not a new incident.
      - series: 'tool_calls{tool="run_query",outcome="audit_unavailable",access="read",job="gw",instance="hist"}'
        values: '1x10 _x19 1x10'
      - series: 'audit_fallback_failures_total{job="gw",instance="hist"}'
        values: '2x10 _x19 2x10'
      - series: 'audit_failure_recent{kind="write",job="gw",instance="hist"}'
        values: '0x10 _x19 0x10'
      - series: 'audit_failure_recent{kind="fallback",job="gw",instance="hist"}'
        values: '0x10 _x19 0x10'
      - series: 'process_start_time_seconds{job="gw",instance="hist"}'
        values: '0x10 _x19 0x10'
    alert_rule_test:
      - eval_time: 32m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 32m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
  - interval: 1m
    input_series:
      # Two releases in one namespace, scraped under one job: `a` sweeps and
      # prunes, `b` never has. `a` must not hide `b`.
      - series: 'build_info{job="gw",namespace="ns",service="a",instance="a1",version="1",git_sha="x"}'
        values: '1x30'
      - series: 'build_info{job="gw",namespace="ns",service="b",instance="b1",version="1",git_sha="x"}'
        values: '1x30'
      - series: 'audit_reaper_last_success_timestamp{job="gw",namespace="ns",service="a",instance="a1"}'
        values: '0+60x30'
      - series: 'audit_pruner_last_success_timestamp{job="gw",namespace="ns",service="a",instance="a1"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: GatewayAuditReaperStale
        exp_alerts:
          - exp_labels: { severity: warning, job: gw, namespace: ns, service: b }
            exp_annotations:
              summary: No abandoned-call reaper sweep completed in 10 minutes.
              description: Intent rows of crashed calls are not being closed as abandoned.
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditreaperstale
      - eval_time: 20m
        alertname: GatewayAuditPrunerStale
        exp_alerts:
          - exp_labels: { severity: warning, job: gw, namespace: ns, service: b }
            exp_annotations:
              summary: No successful audit retention prune in 3 hours.
              description: Audit rows past AUDIT_RETENTION_DAYS are not being deleted.
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditprunerstale
