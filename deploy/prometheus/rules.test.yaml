# `promtool test rules deploy/prometheus/rules.test.yaml`: the audit-failure
# alerts fire on a steady increase and on a recent failure stamp
# (`audit_last_failure_timestamp`), so a refusal before a pod's first scrape
# shows however late that scrape is; they clear once the stamp is older than
# the window, stay quiet on a flat 0, and on a long-lived pod's old count
# after a scrape outage. The reaper and pruner staleness alerts are per
# deployment, even for two releases in one job.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      # A pod whose first scrape (3m) already counts a refusal made at 2m30s,
      # flat afterwards.
      - series: 'tool_calls{tool="run_query",outcome="audit_unavailable",access="read",job="gw",instance="new"}'
        values: '_x3 1x40'
      - series: 'audit_last_failure_timestamp{kind="write",job="gw",instance="new"}'
        values: '_x3 150x40'
      # A pod registered at 0 that never refuses.
      - series: 'tool_calls{tool="run_query",outcome="audit_unavailable",access="read",job="gw",instance="quiet"}'
        values: '0x40'
      - series: 'audit_fallback_failures_total{job="gw",instance="new"}'
        values: '_x3 2x40'
      - series: 'audit_last_failure_timestamp{kind="fallback",job="gw",instance="new"}'
        values: '_x3 170x40'
    alert_rule_test:
      - eval_time: 2m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 4m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 15m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
      # Past the 5m increase window, still inside the 15m stamp window.
      - eval_time: 17m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 15m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
      # 15m after the refusal at 2m30s: quiet.
      - eval_time: 18m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 4m
        alertname: GatewayAuditFallbackFailures
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Disconnect-path audit writes failed.
              description: 'Disconnect-path audit writes failed in the last 30m; those calls are recorded only once the reaper marks them abandoned.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditfallbackfailures
      - eval_time: 32m
        alertname: GatewayAuditFallbackFailures
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Disconnect-path audit writes failed.
              description: 'Disconnect-path audit writes failed in the last 30m; those calls are recorded only once the reaper marks them abandoned.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditfallbackfailures
      - eval_time: 33m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
  - interval: 1m
    input_series:
      # Late first scrape: a pod up since 0, refusing at 25m, first scraped
      # at 30m — long past any boot-age window.
      - series: 'tool_calls{tool="run_query",outcome="audit_unavailable",access="read",job="gw",instance="late"}'
        values: '_x30 1x15'
      - series: 'audit_last_failure_timestamp{kind="write",job="gw",instance="late"}'
        values: '_x30 1500x15'
      - series: 'audit_fallback_failures_total{job="gw",instance="late"}'
        values: '_x30 1x15'
      - series: 'audit_last_failure_timestamp{kind="fallback",job="gw",instance="late"}'
        values: '_x30 1500x15'
      - series: 'process_start_time_seconds{job="gw",instance="late"}'
        values: '_x30 0x15'
    alert_rule_test:
      - eval_time: 30m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 15m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
      - eval_time: 39m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 15m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
      - eval_time: 40m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 30m
        alertname: GatewayAuditFallbackFailures
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Disconnect-path audit writes failed.
              description: 'Disconnect-path audit writes failed in the last 30m; those calls are recorded only once the reaper marks them abandoned.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditfallbackfailures
  - interval: 1m
    input_series:
      # A long-lived pod whose counter steps from 0 to 3, with no stamp (a
      # gateway clock skewed past the window, or an older image).
      - series: 'tool_calls{tool="run_query",outcome="audit_unavailable",access="read",pod="old"}'
        values: '0x10 3x10'
    alert_rule_test:
      - eval_time: 9m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 12m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 15m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
  - interval: 1m
    input_series:
      # A pod up since 0 with old refusals and failures (stamped at 1m),
      # unscraped from 11m to 30m: its counts are history, not a new incident.
      - series: 'tool_calls{tool="run_query",outcome="audit_unavailable",access="read",job="gw",instance="old"}'
        values: '1x10 _x19 1x10'
      - series: 'audit_last_failure_timestamp{kind="write",job="gw",instance="old"}'
        values: '60x10 _x19 60x10'
      - series: 'audit_fallback_failures_total{job="gw",instance="old"}'
        values: '2x10 _x19 2x10'
      - series: 'audit_last_failure_timestamp{kind="fallback",job="gw",instance="old"}'
        values: '60x10 _x19 60x10'
    alert_rule_test:
      - eval_time: 32m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 32m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
  - interval: 1m
    input_series:
      # Two releases in one namespace, scraped under one job: `a` sweeps and
      # prunes, `b` never has. `a` must not hide `b`.
      - series: 'build_info{job="gw",namespace="ns",service="a",instance="a1",version="1",git_sha="x"}'
        values: '1x30'
      - series: 'build_info{job="gw",namespace="ns",service="b",instance="b1",version="1",git_sha="x"}'
        values: '1x30'
      - series: 'audit_reaper_last_success_timestamp{job="gw",namespace="ns",service="a",instance="a1"}'
        values: '0+60x30'
      - series: 'audit_pruner_last_success_timestamp{job="gw",namespace="ns",service="a",instance="a1"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: GatewayAuditReaperStale
        exp_alerts:
          - exp_labels: { severity: warning, job: gw, namespace: ns, service: b }
            exp_annotations:
              summary: No abandoned-call reaper sweep completed in 10 minutes.
              description: Intent rows of crashed calls are not being closed as abandoned.
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditreaperstale
      - eval_time: 20m
        alertname: GatewayAuditPrunerStale
        exp_alerts:
          - exp_labels: { severity: warning, job: gw, namespace: ns, service: b }
            exp_annotations:
              summary: No successful audit retention prune in 3 hours.
              description: Audit rows past AUDIT_RETENTION_DAYS are not being deleted.
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditprunerstale
