# `promtool test rules deploy/prometheus/rules.test.yaml`: the audit-failure
# alerts fire on a steady increase and on the gauge the gateway holds at 1
# after a failure (`audit_failure_recent`), so a failure before a pod's first
# scrape shows while the hold lasts; they clear within 5m of the gauge, stay
# quiet on a flat 0 and on a long-lived pod's old count after a scrape outage.
# A replica without the gauge keeps the older first-scrape clause. Gauge checks
# stay a minute off the 5m edge, which Prometheus 2 and 3 count differently.
# The reaper and pruner staleness alerts are per deployment, even for two
# releases in one job.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      # Pods scraped from boot, all at 0: quiet.
      - series: 'tool_calls{tool="run_query",outcome="audit_unavailable",access="read",job="gw",instance="quiet"}'
        values: '0x40'
      - series: 'audit_fallback_failures_total{job="gw",instance="quiet"}'
        values: '0x40'
      - series: 'audit_failure_recent{kind="write",job="gw",instance="quiet"}'
        values: '0x40'
      - series: 'audit_failure_recent{kind="fallback",job="gw",instance="quiet"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 30m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 5m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
      - eval_time: 30m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
  - interval: 1m
    input_series:
      # Failed at 10m, first scraped at 24m with the counters already above 0:
      # fires on that scrape, clears within 5m of the holds (25m and 40m).
      - series: 'tool_calls{tool="run_query",outcome="audit_unavailable",access="read",job="gw",instance="late"}'
        values: '_x24 1x40'
      - series: 'audit_fallback_failures_total{job="gw",instance="late"}'
        values: '_x24 1x40'
      - series: 'audit_failure_recent{kind="write",job="gw",instance="late"}'
        values: '_x24 1 0x40'
      - series: 'audit_failure_recent{kind="fallback",job="gw",instance="late"}'
        values: '_x24 1x15 0x30'
    alert_rule_test:
      - eval_time: 23m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 24m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 20m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
      - eval_time: 28m
        alertname: GatewayAuditUnavailable
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Tool calls refused because the audit store refused a write.
              description: 'Tool calls were answered audit_unavailable in the last 20m. Audit is synchronous (MUST #4): the state DB is refusing audit writes and agents get no answers.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditunavailable
      - eval_time: 30m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 40m
        alertname: GatewayAuditUnavailable
        exp_alerts: []
      - eval_time: 23m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
      - eval_time: 24m
        alertname: GatewayAuditFallbackFailures
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Fallback audit writes failed.
              description: 'Fallback audit writes (after a disconnect, or a failed completion write) failed in the last 35m. The reaper records those calls that committed an intent as abandoned; the others have no audit row.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditfallbackfailures
      - eval_time: 39m
        alertname: GatewayAuditFallbackFailures
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Fallback audit writes failed.
              description: 'Fallback audit writes (after a disconnect, or a failed completion write) failed in the last 35m. The reaper records those calls that committed an intent as abandoned; the others have no audit row.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditfallbackfailures
      - eval_time: 43m
        alertname: GatewayAuditFallbackFailures
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Fallback audit writes failed.
              description: 'Fallback audit writes (after a disconnect, or a failed completion write) failed in the last 35m. The reaper records those calls that committed an intent as abandoned; the others have no audit row.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditfallbackfailures
      - eval_time: 45m
        alertname: GatewayAuditFallbackFailures
        exp_alerts: []
