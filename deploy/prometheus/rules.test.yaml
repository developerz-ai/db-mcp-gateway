      - series: 'audit_failure_recent{kind="fallback",job="gw",instance="new2"}'
        values: '0x10 _x20 0x30'
      - series: 'build_info{version="2.4.1",git_sha="x",job="gw",instance="old"}'
        values: '1x10 stale _x19 1x30'
      - series: 'audit_abandoned_total{job="gw",instance="old"}'
        values: '1x10 stale _x19 1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: GatewayOlderThanRules
        exp_alerts: []
      - eval_time: 15m
        alertname: GatewayOlderThanRules
        exp_alerts: []
      - eval_time: 31m
        alertname: GatewayOlderThanRules
        exp_alerts: []
      - eval_time: 45m
        alertname: GatewayOlderThanRules
        exp_alerts: []
      - eval_time: 46m
        alertname: GatewayOlderThanRules
        exp_alerts:
          - exp_labels: { severity: warning, job: gw, instance: old, version: "2.4.1", git_sha: x }
            exp_annotations:
              summary: A gateway runs an image older than the alert rules.
              description: 'old runs 2.4.1, which exports no audit_failure_recent: an audit failure before its first scrape does not alert.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayolderthanrules
  - interval: 1m
    input_series:
      # A rollback at 11m on one target: the old image fires 15m after it.
      - series: 'build_info{version="9.9.9",git_sha="x",job="gw",instance="back"}'
        values: '1x10 stale'
      - series: 'audit_failure_recent{kind="write",job="gw",instance="back"}'
        values: '0x10 stale'
      - series: 'audit_failure_recent{kind="fallback",job="gw",instance="back"}'
        values: '0x10 stale'
      - series: 'build_info{version="2.4.1",git_sha="x",job="gw",instance="back"}'
        values: '_x11 1x40'
      - series: 'audit_abandoned_total{job="gw",instance="back"}'
        values: '0x51'
    alert_rule_test:
      - eval_time: 10m
        alertname: GatewayOlderThanRules
        exp_alerts: []
      - eval_time: 25m
        alertname: GatewayOlderThanRules
        exp_alerts: []
      - eval_time: 26m
        alertname: GatewayOlderThanRules
        exp_alerts:
          - exp_labels: { severity: warning, job: gw, instance: back, version: "2.4.1", git_sha: x }
            exp_annotations:
              summary: A gateway runs an image older than the alert rules.
              description: 'back runs 2.4.1, which exports no audit_failure_recent: an audit failure before its first scrape does not alert.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayolderthanrules
  - interval: 1m
    input_series:
      # Two pods on one instance: the new one does not excuse the old one.
      - series: 'build_info{version="2.4.1",git_sha="x",job="gw",instance="host",pod="p1"}'
        values: '1x40'
      - series: 'audit_abandoned_total{job="gw",instance="host",pod="p1"}'
        values: '1x40'
      - series: 'build_info{version="9.9.9",git_sha="x",job="gw",instance="host",pod="p2"}'
        values: '1x40'
      - series: 'audit_abandoned_total{job="gw",instance="host",pod="p2"}'
        values: '1x40'
      - series: 'audit_failure_recent{kind="write",job="gw",instance="host",pod="p2"}'
        values: '0x40'
      - series: 'audit_failure_recent{kind="fallback",job="gw",instance="host",pod="p2"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: GatewayOlderThanRules
        exp_alerts: []
      - eval_time: 15m
        alertname: GatewayOlderThanRules
        exp_alerts:
          - exp_labels: { severity: warning, job: gw, instance: host, pod: p1, version: "2.4.1", git_sha: x }
            exp_annotations:
              summary: A gateway runs an image older than the alert rules.
              description: 'host runs 2.4.1, which exports no audit_failure_recent: an audit failure before its first scrape does not alert.'
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayolderthanrules
  - interval: 1m
    input_series:
      # Two releases in one namespace, scraped under one job: `a` sweeps and
      # prunes, `b` never has. `a` must not hide `b`.
      - series: 'build_info{job="gw",namespace="ns",service="a",instance="a1",version="1",git_sha="x"}'
        values: '1x30'
      - series: 'build_info{job="gw",namespace="ns",service="b",instance="b1",version="1",git_sha="x"}'
        values: '1x30'
      - series: 'audit_reaper_last_success_timestamp{job="gw",namespace="ns",service="a",instance="a1"}'
        values: '0+60x30'
      - series: 'audit_pruner_last_success_timestamp{job="gw",namespace="ns",service="a",instance="a1"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: GatewayAuditReaperStale
        exp_alerts:
          - exp_labels: { severity: warning, job: gw, namespace: ns, service: b }
            exp_annotations:
              summary: No abandoned-call reaper sweep completed in 10 minutes.
              description: Intent rows of crashed calls are not being closed as abandoned.
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditreaperstale
      - eval_time: 20m
        alertname: GatewayAuditPrunerStale
        exp_alerts:
          - exp_labels: { severity: warning, job: gw, namespace: ns, service: b }
            exp_annotations:
              summary: No successful audit retention prune in 3 hours.
              description: Audit rows past AUDIT_RETENTION_DAYS are not being deleted.
              runbook_url: https://github.com/developerz-ai/db-mcp-gateway/blob/main/deploy/runbook.md#gatewayauditprunerstale
