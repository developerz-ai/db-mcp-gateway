name: pages

# Publishes the static docs/marketing site in docs/site/ to GitHub Pages.
# No build step — this is a Rust repo with no YARD/Jekyll pipeline, so we
# upload docs/site/ as-is and let deploy-pages hand it to the CDN.
#
# One-time repo setting before the first run resolves:
#   gh api -X PUT repos/developerz-ai/db-mcp-gateway/pages -f build_type=workflow
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege; the deploy job needs pages + id-token to publish.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    # Job-level permissions replace workflow-level (they do not merge), so
    # contents: read must be repeated here for actions/checkout to keep repo
    # read access alongside the Pages-deploy scopes.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
