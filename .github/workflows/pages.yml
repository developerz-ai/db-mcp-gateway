name: pages

# Publishes the Docusaurus site under website/ to GitHub Pages.
# Landing page + docs handbook + llms.txt all ship from one build artifact.
#
# One-time repo setting (already applied, kept here for future re-installs):
#   gh api -X PUT repos/developerz-ai/db-mcp-gateway/pages -f build_type=workflow
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  # Build-only on PRs. docusaurus.config.ts sets onBrokenLinks: 'throw', so
  # without this a PR that breaks a link merges green and only fails here on
  # main — leaving the published site stale with no signal on the PR.
  pull_request:
    paths:
      - "website/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege; the deploy job needs pages + id-token to publish.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy mid-flight: actions/deploy-pages can leave the Pages
  # deployment half-applied. Matches GitHub's own Pages template.
  cancel-in-progress: false

jobs:
  # PR gate: typecheck + build, no deploy. Same steps as `deploy` up to the
  # artifact upload.
  build:
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    # Job-level permissions replace workflow-level (they do not merge), so
    # contents: read must be repeated here for actions/checkout to keep repo
    # read access alongside the Pages-deploy scopes.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      # Belt-and-braces: the same denylist as the mdBook workflow. Refuse to
      # publish if a sensitive/config asset lands in the artifact. Contract
      # lives in website/docs/initial-idea/13-docs-site.md.
      - name: Guard Pages artifact against sensitive assets
        run: |
          set -euo pipefail
          mapfile -t offenders < <(find build -type f \
            \( -iname '*.yaml' -o -iname '*.yml' \
               -o -iname '*.env' -o -iname '.env.*' \
               -o -iname '*.pem' -o -iname '*.key' \
               -o -iname '*.toml' -o -iname '*.sql' \))
          if (( ${#offenders[@]} > 0 )); then
            printf '::error::Refusing to publish Pages artifact — sensitive/config asset(s) present:\n'
            printf '  %s\n' "${offenders[@]}"
            exit 1
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
