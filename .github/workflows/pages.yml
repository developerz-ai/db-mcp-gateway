name: pages

# Publishes the Docusaurus site under website/ to GitHub Pages.
# Landing page + docs handbook + llms.txt all ship from one build artifact.
#
# One-time repo setting (already applied, kept here for future re-installs):
#   gh api -X PUT repos/developerz-ai/db-mcp-gateway/pages -f build_type=workflow
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  # A PR that touches the site is built by ci.yml's `website` job (under
  # `gate`); this workflow builds on a PR only when the PR changes it.
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege; the deploy job needs pages + id-token to publish.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy mid-flight: actions/deploy-pages can leave the Pages
  # deployment half-applied. Matches GitHub's own Pages template.
  cancel-in-progress: false

jobs:
  # Typecheck + build on every event; outside PRs it also uploads the artifact
  # `deploy` publishes. Upload and deploy are separate jobs because deploy-pages
  # lists the run's artifacts once, with no retry: in one job the listing raced
  # the upload and lost deploys. tests/bin/pages-workflow.test.sh pins this.
  build:
    # GitHub-hosted runner: this repository is public.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # configure-pages reads the Pages site.
      pages: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      # Not setup-node's `cache: npm`: it saved an entry from every PR (one per
      # npm bump, readable by that PR alone) and restored only on an exact lock
      # match. Restore with a prefix fallback; save from `main` alone, where
      # every branch (and ci.yml's `website` job) can read it.
      - id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('website/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('website/package-lock.json') }}
      - run: npm run typecheck
      - run: npm run build
      # Belt-and-braces: the same denylist as the mdBook workflow. Refuse to
      # publish if a sensitive/config asset lands in the artifact. Contract
      # lives in website/docs/initial-idea/13-docs-site.md. `find` runs inside
      # the condition so a scan error fails the step; no path is printed.
      - name: Guard Pages artifact against sensitive assets
        working-directory: website
        run: |
          if ! findings=$(find build -type f \
            \( -iname '*.yaml' -o -iname '*.yml' \
               -o -iname '*.env' -o -iname '.env.*' \
               -o -iname '*.pem' -o -iname '*.key' \
               -o -iname '*.toml' -o -iname '*.sql' \) -print -quit 2>/dev/null); then
            printf '%s\n' 'Unable to scan Pages artifact'
            exit 1
          fi
          if [[ -n $findings ]]; then
            printf '%s\n' 'Refusing to publish sensitive/config assets'
            exit 1
          fi
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: website/build

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
