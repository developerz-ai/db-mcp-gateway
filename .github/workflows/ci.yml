name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # PRs: one group per ref, superseded runs cancelled. Pushes to main: one
  # group per SHA — Argo Image Updater pins the short SHA (see the `build`
  # job), and a shared group still cancels a *pending* run when a third merge
  # queues behind it (GitHub keeps one pending run per group), leaving that
  # commit with no image at its tag.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Docs-only PRs skip the Rust jobs. The skip is per job, not a workflow-level
  # `paths-ignore`: `clippy` and `test` are required checks, and a workflow that
  # never starts leaves them pending forever, while a job skipped by `if:`
  # reports as passed. Pushes to `main` always run everything — `merge` needs
  # them. Docs guards (pages.yml) run on their own path filter.
  #
  # Docs = `website/`, `docs/`, `.claude/` (agent config; its hooks are tested
  # by workflow-lint.yml) and `*.md` — except under `.dz/`: tests/brief_rows.rs
  # reads `.dz/briefs/health.md`, so a `.dz/` change always runs `test`.
  # public-tree scans every tracked file and runs regardless.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A PR checkout is the merge commit; its first parent is the base tip,
          # so HEAD^1..HEAD is exactly what the PR changes.
          fetch-depth: 2
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          code=false
          if printf '%s\n' "$changed" | grep -qE '^\.dz/' \
            || printf '%s\n' "$changed" \
              | grep -vE '^(website/|docs/|\.claude/)|\.md$' | grep -q .; then
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code-affecting changes: $code"

  fmt:
    # GitHub-hosted runner: this repository is public.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the exact channel and components; the
      # runner's rustup installs it. No `dtolnay/rust-toolchain` step: it
      # downloaded the latest `stable` (~10 s a job) that the toolchain file
      # then overrode.
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - run: cargo fmt --all -- --check
      # Pinning every action to a SHA is only worth anything if it stays that
      # way. Review alone won't hold the line — a single `@v3` merged later
      # silently restores the mutable-tag exposure. Lives in `fmt` because it
      # is the cheapest job that already has a checkout. Local `./…` actions
      # are same-repo and exempt.
      - name: actions are SHA-pinned
        run: |
          # Anchored to line start so this step's own pattern (which contains
          # the literal `uses:`) doesn't match itself. Recursive scan covers
          # both `.yml` and `.yaml` — GitHub loads both, so a new `.yaml`
          # workflow with a mutable ref must not slip past this gate.
          # The allow-line regex validates the FULL `uses:` line: pin ref +
          # `@` + 40-hex SHA + trailing `# <version>` comment. `# stable`
          # is accepted for toolchain-channel actions (e.g. dtolnay/rust-toolchain).
          unpinned=$(grep -rhP --include='*.yml' --include='*.yaml' \
            '^\s*-?\s*uses:\s*' .github/workflows \
            | grep -vP '^\s*-?\s*uses:\s*\./' \
            | grep -vP '^\s*-?\s*uses:\s*[^[:space:]#]+@[0-9a-f]{40}\s+#\s+\S+\s*$' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::unpinned action ref(s) — pin to a 40-char commit SHA with the version in a trailing comment:"
            printf '  %s\n' "$unpinned"
            exit 1
          fi

  # Rust cache: the default rust-cache key is job id + rustc version +
  # Cargo.lock/Cargo.toml hashes, so clippy (check artifacts) and test (full
  # builds) each restore their own warm dependency cache. Saved from `main`
  # only. A shared key made both jobs race to save one entry, and the loser
  # restored the other job's artifacts — a cold build in disguise.
  #
  # No `cargo clean -p db-mcp-gateway`: restored local-crate artifacts can't go
  # stale (rust-cache drops workspace crates before saving, and checkout mtimes
  # are newer than any cached fingerprint). The E0063 failure it was added for
  # (#188) was a real semantic merge conflict: a PR's checkout is the merge
  # commit with `main`, which carried the test file the PR branch lacked.
  clippy:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # ~2x the measured p95 (cold, Cargo.lock-changing run: 344 s; warm ~60 s).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-cache keys on every installed toolchain, so the runner image's
      # preinstalled `stable` would re-key (cold-start) this cache whenever
      # the image picks up a new release. Only the pinned toolchain stays.
      - name: install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          if rustup toolchain list | grep -q '^stable'; then
            rustup toolchain uninstall stable
          fi
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          save-if: true # TEMP: seed PR cache to measure a warm run; reverted next commit
      - run: cargo clippy --profile ci --all-targets --all-features -- -D warnings
      # --all-targets enables cfg(test), which makes imports used only by
      # #[cfg(any(test, debug_assertions))] helpers look live. The release
      # configuration compiles those helpers out, so the same code emitted
      # unused-import warnings that only ever surfaced in a `docker build`.
      # Lint the shipping configuration too.
      - run: cargo clippy --release --all-features -- -D warnings
      # The credential scrubber compiles its regexes at runtime, so a `regex`
      # feature missing from the *shipping* graph passes fmt, clippy and
      # `cargo test` and only surfaces in production. It did: `unicode-case`
      # came in via a dev-dependency, so `(?i)` failed to compile in the release
      # image alone and every GlitchTip event arrived fully redacted.
      - run: bin/check-scrub-features

  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # ~2x the measured p95 (cold, Cargo.lock-changing run: 471 s).
    timeout-minutes: 20
    # The dev stack (docker-compose.dev.yml) instead of `services:`. Service
    # containers block the job until every image is pulled and healthy —
    # measured 30-38 s of "Initialize containers" before the first step.
    # Started in the background, the pull and boot overlap the toolchain
    # install, cache restore and compile (~100 s), and CI tests against the
    # exact stack `bin/test` brings up locally; tests/common/env.rs defaults
    # to its ports and credentials, so no URL overrides are needed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: start the dev stack in the background
        # `|| rc=$?`, not a bare `$?`: the step shell runs with `-e`, which
        # would end the subshell before a failure status was recorded.
        run: |
          (rc=0
            docker compose -f docker-compose.dev.yml up -d --wait \
              > "$RUNNER_TEMP/stack.log" 2>&1 || rc=$?
            echo "$rc" > "$RUNNER_TEMP/stack.rc") &
      - name: install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          if rustup toolchain list | grep -q '^stable'; then
            rustup toolchain uninstall stable
          fi
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          save-if: true # TEMP: seed PR cache to measure a warm run; reverted next commit
      - name: install cargo-nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-nextest@0.9.151
      # Same runner `bin/test` uses locally (.config/nextest.toml, `ci`
      # profile: no retries, JUnit report). `--all-features` gates the
      # bench-harness tests in `benchmarks/harness/*`, which are otherwise
      # skipped; no runtime image is produced here, so that bin never ships.
      # `--all-targets` excludes doctests, as `cargo test --all-targets` did.
      # Built with `--no-run` first so the compile overlaps the stack boot.
      - run: cargo nextest run --profile ci --cargo-profile ci --all-targets --all-features --no-run
      - name: wait for the dev stack
        run: |
          for _ in $(seq 180); do
            [ -s "$RUNNER_TEMP/stack.rc" ] && break
            sleep 1
          done
          rc=$(cat "$RUNNER_TEMP/stack.rc" 2>/dev/null || echo 'still starting after 180 s')
          if [ "$rc" != 0 ]; then
            echo "::error::dev stack did not come up healthy (rc=$rc)"
            cat "$RUNNER_TEMP/stack.log"
            docker compose -f docker-compose.dev.yml ps -a
            exit 1
          fi
      - run: cargo nextest run --profile ci --cargo-profile ci --all-targets --all-features
      - name: upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      # Prebuilt cargo-audit binary instead of `cargo install` (source compile
      # every run). taiki-e/install-action pulls the release binary; the audit
      # invocation and audit.toml ignore semantics below are unchanged.
      - name: install cargo-audit
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-audit
      # RUSTSEC-2023-0071 (rsa via sqlx-mysql). NOT unreachable — MySQL is a
      # supported permissions_store driver and CI exercises it. rsa 0.10 is
      # fixed upstream, but sqlx 0.9 requires Rust 1.94 and cannot preserve the
      # project's Rust 1.88 MSRV. See .cargo/audit.toml for the MSRV-raise plus
      # sqlx-upgrade removal trigger.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  # Spec 14 invariant: no literal dbmcp_svc_ service tokens in committed YAML.
  # The loader deliberately accepts Password::Literal for dev/test parity with
  # Database.password (issue #190), so it cannot enforce credential-free
  # committed config at boot — this job enforces it at the CI layer instead.
  # Standalone today: it reports PR status but is not wired into build.needs
  # and is not a required check (do not make it required without also running
  # it on every PR, or it hard-locks merges).
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: reject literal service tokens in committed config
        # git grep scans every TRACKED file (not just YAML) — the credential
        # surface is broader than .yaml/.yml (.env.example, JSON, shell
        # scripts, Dockerfile all commit). Exit codes: 0 = match (FAIL),
        # 1 = no match (the ONLY pass), anything else incl. 128 fatal (FAIL —
        # a broken grep must NEVER read as clean; fail-closed rule, #190;
        # verified empirically — git grep returns 128, not 2, on a fatal
        # regex error, so the lens-suggested `rc -eq 2` check was still
        # fail-open). Pathspec exclusions are the
        # only places a literal token legitimately lives: test fixtures,
        # spec/docs examples, the example config, this workflow, the loader
        # unit-test fixtures.
        run: |
          set +e
          matches="$(git grep -nE "dbmcp_svc_[0-9a-f]{64}" \
              -- ":!tests/**" ":!website/**" ":!config/example.yaml" \
              ":!.github/**" ":!src/config/yaml/**")"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] && [ -n "$matches" ]; then
            echo "::error::literal dbmcp_svc_ service token(s) in committed config — reference the secret via ENV: or FILE: (spec 14). ADVISORY guard: it fails this job; block merges by making secret-scan a required branch-protection check (#190 follow-up)."
            printf '%s\n' "$matches"
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::git grep tooling failure (rc=$rc) — secret-scan cannot read as clean (fail-closed, #190)"
            exit 1
          fi
          echo "no literal service tokens in committed config (git grep rc=1)"
      - name: secret-scan regex regression
        # Pins the guard regex intent (#190) so a future loosening is caught.
        # Wired into CI so it actually runs (was dead code otherwise).
        run: bash tests/bin/secret-scan-regex.test.sh

  # The public-tree guard (tests/public_tree.rs) runs on every PR, docs-only
  # included: the leaks it catches live mostly in markdown, which the
  # `changes` filter keeps out of `test`. Reads tracked files only — no
  # service containers.
  public-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-cache keys on every installed toolchain, so the runner image's
      # preinstalled `stable` would re-key (cold-start) this cache whenever
      # the image picks up a new release. Only the pinned toolchain stays.
      - name: install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          if rustup toolchain list | grep -q '^stable'; then
            rustup toolchain uninstall stable
          fi
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: public-tree
          save-if: true # TEMP: seed PR cache to measure a warm run; reverted next commit
      - run: cargo test --profile ci --test public_tree

  # Publish a multi-arch image on push to main, tagged with the short commit
  # SHA (what Argo Image Updater pins to, #17) + a moving `main` tag.
  # Release tags (semver + :latest + GitHub release) live in release.yml.
  #
  # The gate sits on `merge`, not here: `build` starts with the quality jobs
  # instead of after them, taking `test` (~190 s) off the main-push critical
  # path. A red commit still never gets an image at a tag anything consumes:
  # only its per-arch `linux-<arch>-<sha>` refs exist, Image Updater matches
  # `^sha-[0-9a-f]{7}$` alone, and `sha-*`/`main` are written by `merge`,
  # which needs every quality job green. release.yml reuses `sha-*` the same
  # way, so it inherits the gate.
  #
  # Built on NATIVE per-arch runners in parallel (amd64 + arm64), each pushed at
  # a per-arch tag, then stitched into one manifest list by `merge`. Native arm64
  # replaces QEMU emulation, which tripled build time once the mysql/mongo deps
  # landed and blew the 30-min ceiling — no `main` image shipped for a week.
  #
  # DUAL-PUSH: every per-arch image is also pushed to DOCR
  # (registry.digitalocean.com/developerz-ai/db-mcp-gateway) using the org-level
  # `DOCR_TOKEN` Actions secret. GHCR stays the public artifact; DOCR is the
  # in-cluster source Image Updater tracks, so the per-arch images must live in
  # DOCR too — a cross-registry manifest list (per-arch in GHCR, manifest in
  # DOCR) would fail to pull on a reschedule. `merge` then creates the
  # multi-arch manifest list under the same short-SHA + main tags in BOTH
  # registries.
  #
  # Per-arch tag (`linux-amd64-<short-sha>`), not push-by-digest. buildx reports
  # a digest-mode push as successful, but with two `type=image` outputs the
  # per-arch manifest never materializes at that digest ref in GHCR, so `merge`
  # died on `imagetools create ... not found`. A tag is a ref both
  # registries round-trip deterministically — same fix release.yml already
  # carries.
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: prepare platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: derive short sha
        id: sha
        # Same 7-char form docker/metadata-action's `type=sha,format=short`
        # produces, so the per-arch tags below and the final manifest tag in
        # `merge` are derived from one value.
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to ghcr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: log in to docr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}
      - name: image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            registry.digitalocean.com/developerz-ai/db-mcp-gateway
          # Per-arch tag declared for BOTH registries so one `tags:` list pushes
          # a concrete, fetchable ref to each.
          tags: |
            type=raw,value=${{ env.PLATFORM_PAIR }}-${{ steps.sha.outputs.short }}
      - name: build & push per-arch
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true

  # Stitch the per-arch digests into one multi-arch manifest under the real
  # tags. Skipped automatically when `build` is skipped (PRs), any arch fails,
  # or any quality job fails — this is the publish gate.
  # DUAL-PUSH: the same multi-arch manifest list is created in BOTH registries
  # so the short-SHA + main tags are pullable from whichever Image Updater (or
  # any external client) is configured to read.
  merge:
    needs: [build, fmt, clippy, test, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: derive short sha
        id: sha
        # Mirror the build job's derive so both read the same per-arch tag.
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to ghcr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: log in to docr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}
      - name: derive ghcr image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Three tags per commit:
          #   sha-a1b2c3d — what ArgoCD Image Updater tracks. Its allow-tags is
          #     `regexp:^sha-[0-9a-f]{7}$`, so the `sha-` prefix is load-bearing:
          #     without it the updater matches nothing and the cluster silently
          #     never rolls forward.
          #   a1b2c3d — bare form, kept for anything already pinning it.
          #   main — moving convenience tag.
          tags: |
            type=sha,format=short
            type=sha,prefix=,format=short
            type=raw,value=main
      - name: create ghcr manifest list & push
        run: |
          # shellcheck disable=SC2046  # word-splitting is intentional: one -t per tag
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "ghcr.io/${{ github.repository }}:linux-amd64-${{ steps.sha.outputs.short }}" \
            "ghcr.io/${{ github.repository }}:linux-arm64-${{ steps.sha.outputs.short }}"
      - name: derive docr image metadata
        id: meta-docr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: registry.digitalocean.com/developerz-ai/db-mcp-gateway
          # Mirror the GHCR tag set exactly. DOCR is the registry Image Updater
          # actually reads, so `sha-<7>` must exist here above all.
          tags: |
            type=sha,format=short
            type=sha,prefix=,format=short
            type=raw,value=main
      - name: create docr manifest list & push
        env:
          # docker/metadata-action@v5 auto-sets only `DOCKER_METADATA_OUTPUT_JSON`
          # (shared name, no per-step suffix); with two metadata steps in the same
          # job the second overwrites the first. Mirror the DOCR step's `json`
          # output into a step-scoped env var so the jq below reads the right
          # tag set.
          DOCR_METADATA_JSON: ${{ steps.meta-docr.outputs.json }}
        run: |
          # shellcheck disable=SC2046  # word-splitting is intentional: one -t per tag
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCR_METADATA_JSON") \
            "registry.digitalocean.com/developerz-ai/db-mcp-gateway:linux-amd64-${{ steps.sha.outputs.short }}" \
            "registry.digitalocean.com/developerz-ai/db-mcp-gateway:linux-arm64-${{ steps.sha.outputs.short }}"
      - name: inspect
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
