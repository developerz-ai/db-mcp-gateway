name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Separate target DB the exec layer connects to (#4 onward). Matches
      # the `target-db` service in docker-compose.dev.yml — user/pass/db/port
      # are the same so the same e2e configs work in CI and locally.
      target-db:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app-dev-only
          POSTGRES_DB: app
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # MySQL permissions store for #59's parity tests. Optional in prod
      # (only opened when `permissions_store.driver = mysql`), but CI
      # always boots it so the mysql repo tests run on every push.
      permissions-mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql-dev-only
          MYSQL_DATABASE: permissions
          MYSQL_USER: permissions
          MYSQL_PASSWORD: permissions-dev-only
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -pmysql-dev-only"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # Mongo target for #58's adapter integration tests. Mirrors the
      # `target-mongo` service in docker-compose.dev.yml. The dev container
      # bootstraps a root user in `admin`, which is why the test fixtures
      # set `Database.auth_database = Some("admin")`.
      target-mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: app
          MONGO_INITDB_ROOT_PASSWORD: app-dev-only
          MONGO_INITDB_DATABASE: app
        ports: ["27018:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://gateway:gateway@localhost:5432/gateway
      # Read by `Config::from_env` for the gateway's state DB pool. Kept
      # distinct from DATABASE_URL because we connect to multiple target
      # DBs (see exec layer, #4).
      STATE_DB_URL: postgres://gateway:gateway@localhost:5432/gateway
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test --all-targets

  audit:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Prebuilt cargo-audit binary instead of `cargo install` (source compile
      # every run). taiki-e/install-action pulls the release binary; the audit
      # invocation and audit.toml ignore semantics below are unchanged.
      - name: install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # RUSTSEC-2023-0071 (rsa via sqlx-mysql) is unreachable: we only enable
      # the postgres backend, sqlx-mysql is pulled in transitively but never
      # executed. See audit.toml for the long-form justification.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  # Publish a multi-arch image on push to main, tagged with the short commit
  # SHA (what Argo Image Updater pins to, #17) + a moving `main` tag. Gated by
  # the quality jobs above so an unpublishable commit never ships an image.
  # Release tags (semver + :latest + GitHub release) live in release.yml.
  #
  # Built on NATIVE per-arch runners in parallel (amd64 + arm64), each pushed by
  # digest, then stitched into one manifest list by `merge`. Native arm64
  # replaces QEMU emulation, which tripled build time once the mysql/mongo deps
  # landed and blew the 30-min ceiling — no `main` image shipped for a week.
  #
  # DUAL-PUSH (#907): every per-arch image is also pushed to DOCR
  # (registry.digitalocean.com/developerz-ai/db-mcp-gateway) using the org-level
  # `DOCR_TOKEN` Actions secret (the same secret proven live on discord-server,
  # mmarketing, venom-astrology). GHCR stays the public artifact; DOCR is the
  # in-cluster source Image Updater tracks, so the per-arch images must live in
  # DOCR too — a cross-registry manifest list (per-arch in GHCR, manifest in
  # DOCR) would fail to pull on a reschedule. `merge` then creates the
  # multi-arch manifest list under the same short-SHA + main tags in BOTH
  # registries.
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fmt, clippy, test, audit]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: blacksmith-2vcpu-ubuntu-2404
          - platform: linux/arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - name: prepare platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: log in to docr
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}
      - name: image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
      - name: build & push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: |
            type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
            type=image,name=registry.digitalocean.com/developerz-ai/db-mcp-gateway,push-by-digest=true,name-canonical=true,push=true
      - name: export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into one multi-arch manifest under the real
  # tags. Skipped automatically when `build` is skipped (PRs) or any arch fails.
  # DUAL-PUSH: the same multi-arch manifest list is created in BOTH registries
  # so the short-SHA + main tags are pullable from whichever Image Updater (or
  # any external client) is configured to read.
  merge:
    needs: [build]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: log in to docr
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}
      - name: derive ghcr image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # bare short SHA (e.g. a1b2c3d) + moving `main` tag
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=main
      - name: create ghcr manifest list & push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # word-splitting is intentional: one -t per tag, one image ref per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      - name: derive docr image metadata
        id: meta-docr
        uses: docker/metadata-action@v5
        with:
          images: registry.digitalocean.com/developerz-ai/db-mcp-gateway
          # mirror the GHCR tag set so the same :<sha> / :main refs work in DOCR
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=main
      - name: create docr manifest list & push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # word-splitting is intentional: one -t per tag, one image ref per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON_DOCR") \
            $(printf 'registry.digitalocean.com/developerz-ai/db-mcp-gateway@sha256:%s ' *)
      - name: inspect
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
