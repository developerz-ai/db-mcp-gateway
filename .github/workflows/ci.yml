name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PRs: cancel superseded runs. Pushes to main: never — Argo Image Updater
  # pins to the short SHA (see the `build` job), so cancelling the first of two
  # closely-landed merges leaves that commit with no image at its tag.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # A Cargo.lock change misses the cache, and a cold build of this graph
    # (aws-lc-rs, mongodb, sqlx ×2 backends, sentry, axum) on 2 vCPU runs well
    # past 15 min. release.yml already went to 60 for the same reason.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # --all-targets enables cfg(test), which makes imports used only by
      # #[cfg(any(test, debug_assertions))] helpers look live. The release
      # configuration compiles those helpers out, so the same code emitted
      # unused-import warnings that only ever surfaced in a `docker build`.
      # Lint the shipping configuration too.
      - run: cargo clippy --release --all-features -- -D warnings

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Separate target DB the exec layer connects to (#4 onward). Matches
      # the `target-db` service in docker-compose.dev.yml — user/pass/db/port
      # are the same so the same e2e configs work in CI and locally.
      target-db:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app-dev-only
          POSTGRES_DB: app
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # MySQL permissions store for #59's parity tests. Optional in prod
      # (only opened when `permissions_store.driver = mysql`), but CI
      # always boots it so the mysql repo tests run on every push.
      permissions-mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql-dev-only
          MYSQL_DATABASE: permissions
          MYSQL_USER: permissions
          MYSQL_PASSWORD: permissions-dev-only
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -pmysql-dev-only"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # Mongo target for #58's adapter integration tests. Mirrors the
      # `target-mongo` service in docker-compose.dev.yml. The dev container
      # bootstraps a root user in `admin`, which is why the test fixtures
      # set `Database.auth_database = Some("admin")`.
      target-mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: app
          MONGO_INITDB_ROOT_PASSWORD: app-dev-only
          MONGO_INITDB_DATABASE: app
        ports: ["27018:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://gateway:gateway@localhost:5432/gateway
      # Read by `Config::from_env` for the gateway's state DB pool. Kept
      # distinct from DATABASE_URL because we connect to multiple target
      # DBs (see exec layer, #4).
      STATE_DB_URL: postgres://gateway:gateway@localhost:5432/gateway
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # No separate `cargo build` step — `cargo test --all-targets` builds the
      # same targets, so the extra invocation was a wasted fingerprint pass.
      - run: cargo test --all-targets

  audit:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
      # Prebuilt cargo-audit binary instead of `cargo install` (source compile
      # every run). taiki-e/install-action pulls the release binary; the audit
      # invocation and audit.toml ignore semantics below are unchanged.
      - name: install cargo-audit
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-audit
      # RUSTSEC-2023-0071 (rsa via sqlx-mysql). NOT unreachable — MySQL is a
      # supported permissions_store driver and CI exercises it. Suppressed only
      # because no fixed upstream `rsa` release exists; the reachable path is
      # a non-TLS caching_sha2_password handshake. Full justification and the
      # mitigation plan are in .cargo/audit.toml.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  # Publish a multi-arch image on push to main, tagged with the short commit
  # SHA (what Argo Image Updater pins to, #17) + a moving `main` tag. Gated by
  # the quality jobs above so an unpublishable commit never ships an image.
  # Release tags (semver + :latest + GitHub release) live in release.yml.
  #
  # Built on NATIVE per-arch runners in parallel (amd64 + arm64), each pushed at
  # a per-arch tag, then stitched into one manifest list by `merge`. Native arm64
  # replaces QEMU emulation, which tripled build time once the mysql/mongo deps
  # landed and blew the 30-min ceiling — no `main` image shipped for a week.
  #
  # DUAL-PUSH (#907): every per-arch image is also pushed to DOCR
  # (registry.digitalocean.com/developerz-ai/db-mcp-gateway) using the org-level
  # `DOCR_TOKEN` Actions secret (the same secret proven live on discord-server,
  # mmarketing, venom-astrology). GHCR stays the public artifact; DOCR is the
  # in-cluster source Image Updater tracks, so the per-arch images must live in
  # DOCR too — a cross-registry manifest list (per-arch in GHCR, manifest in
  # DOCR) would fail to pull on a reschedule. `merge` then creates the
  # multi-arch manifest list under the same short-SHA + main tags in BOTH
  # registries.
  #
  # Per-arch tag (`linux-amd64-<short-sha>`), not push-by-digest. buildx reports
  # a digest-mode push as successful, but with two `type=image` outputs the
  # per-arch manifest never materializes at that digest ref in GHCR, so `merge`
  # died on `imagetools create ... not found`. A tag is a ref both
  # registries round-trip deterministically — same fix release.yml already
  # carries.
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fmt, clippy, test, audit]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - platform: linux/arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - name: prepare platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: derive short sha
        id: sha
        # Same 7-char form docker/metadata-action's `type=sha,format=short`
        # produces, so the per-arch tags below and the final manifest tag in
        # `merge` are derived from one value.
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: log in to ghcr
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: log in to docr
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}
      - name: image labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            registry.digitalocean.com/developerz-ai/db-mcp-gateway
          # Per-arch tag declared for BOTH registries so one `tags:` list pushes
          # a concrete, fetchable ref to each.
          tags: |
            type=raw,value=${{ env.PLATFORM_PAIR }}-${{ steps.sha.outputs.short }}
      - name: build & push per-arch
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true

  # Stitch the per-arch digests into one multi-arch manifest under the real
  # tags. Skipped automatically when `build` is skipped (PRs) or any arch fails.
  # DUAL-PUSH: the same multi-arch manifest list is created in BOTH registries
  # so the short-SHA + main tags are pullable from whichever Image Updater (or
  # any external client) is configured to read.
  merge:
    needs: [build]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: derive short sha
        id: sha
        # Mirror the build job's derive so both read the same per-arch tag.
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: log in to ghcr
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: log in to docr
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}
      - name: derive ghcr image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Three tags per commit:
          #   sha-a1b2c3d — what ArgoCD Image Updater tracks. Its allow-tags is
          #     `regexp:^sha-[0-9a-f]{7}$`, so the `sha-` prefix is load-bearing:
          #     without it the updater matches nothing and the cluster silently
          #     never rolls forward.
          #   a1b2c3d — bare form, kept for anything already pinning it.
          #   main — moving convenience tag.
          tags: |
            type=sha,format=short
            type=sha,prefix=,format=short
            type=raw,value=main
      - name: create ghcr manifest list & push
        run: |
          # shellcheck disable=SC2046  # word-splitting is intentional: one -t per tag
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "ghcr.io/${{ github.repository }}:linux-amd64-${{ steps.sha.outputs.short }}" \
            "ghcr.io/${{ github.repository }}:linux-arm64-${{ steps.sha.outputs.short }}"
      - name: derive docr image metadata
        id: meta-docr
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: registry.digitalocean.com/developerz-ai/db-mcp-gateway
          # Mirror the GHCR tag set exactly. DOCR is the registry Image Updater
          # actually reads, so `sha-<7>` must exist here above all.
          tags: |
            type=sha,format=short
            type=sha,prefix=,format=short
            type=raw,value=main
      - name: create docr manifest list & push
        env:
          # docker/metadata-action@v5 auto-sets only `DOCKER_METADATA_OUTPUT_JSON`
          # (shared name, no per-step suffix); with two metadata steps in the same
          # job the second overwrites the first. Mirror the DOCR step's `json`
          # output into a step-scoped env var so the jq below reads the right
          # tag set (#907).
          DOCR_METADATA_JSON: ${{ steps.meta-docr.outputs.json }}
        run: |
          # shellcheck disable=SC2046  # word-splitting is intentional: one -t per tag
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCR_METADATA_JSON") \
            "registry.digitalocean.com/developerz-ai/db-mcp-gateway:linux-amd64-${{ steps.sha.outputs.short }}" \
            "registry.digitalocean.com/developerz-ai/db-mcp-gateway:linux-arm64-${{ steps.sha.outputs.short }}"
      - name: inspect
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
