name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # DOCR mirror (#907) — the in-cluster source the ArgoCD Image Updater tracks.
  # The same per-arch digests are pushed here, and `merge` builds a matching
  # multi-arch manifest list under the semver + :latest tags. The org-level
  # `DOCR_TOKEN` Actions secret authenticates both the per-arch push and the
  # manifest create (DOC digital-ocean API token; same proven on discord-server,
  # mmarketing, venom-astrology).
  DOCR_REGISTRY: registry.digitalocean.com
  DOCR_IMAGE_NAME: developerz-ai/db-mcp-gateway

jobs:
  # Native per-arch build (amd64 + arm64), each pushed by digest, then merged
  # into one manifest list under the semver + :latest tags. Native arm64 runners
  # replace the single-runner QEMU build that timed out at 30 min (see ci.yml).
  # Release compiles are CPU-bound: amd64 runs on an 8-vCPU runner; arm64 stays
  # on 2-vCPU (no larger arm runner is provisioned for the org — bumping to an
  # unavailable size would hang the release). gha layer cache (cache-from/to
  # below) already memoises the dependency build across runs.
  build:
    runs-on: ${{ matrix.runner }}
    # arm64 is a 2-vCPU runner (no larger arm size provisioned). A release whose
    # Cargo.lock changed busts the cached cargo layer and forces a cold full
    # recompile there, which overran the old 30-min cap (v1.2.1). amd64 (8-vCPU)
    # finishes in ~12m regardless, so a higher ceiling only affects cold arm64.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: blacksmith-8vcpu-ubuntu-2404
          - platform: linux/arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - name: prepare platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          # Build context is `.`; keep the checkout token out of the build
          # workspace (matches ci.yml's image-publish checkout).
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: log in to docr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCR_REGISTRY }}
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}
      - name: image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: build & push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: |
            type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
            type=image,name=${{ env.DOCR_REGISTRY }}/${{ env.DOCR_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
      - name: export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: log in to docr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCR_REGISTRY }}
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}
      - name: derive ghcr image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # v1.2.3 → tags: 1.2.3, 1.2, 1, latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: create ghcr manifest list & push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # word-splitting is intentional: one -t per tag, one image ref per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
      - name: derive docr image metadata
        id: meta-docr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCR_REGISTRY }}/${{ env.DOCR_IMAGE_NAME }}
          # mirror the GHCR tag set so the same :<semver> / :latest refs work in DOCR
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: create docr manifest list & push
        working-directory: ${{ runner.temp }}/digests
        env:
          # docker/metadata-action@v5 auto-sets only `DOCKER_METADATA_OUTPUT_JSON`
          # (shared name, no per-step suffix); with two metadata steps in the same
          # job the second overwrites the first. Mirror the DOCR step's `json`
          # output into a step-scoped env var so the jq below reads the right
          # tag set (#907).
          DOCR_METADATA_JSON: ${{ steps.meta-docr.outputs.json }}
        run: |
          # shellcheck disable=SC2046  # word-splitting is intentional: one -t per tag, one image ref per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCR_METADATA_JSON") \
            $(printf '${{ env.DOCR_REGISTRY }}/${{ env.DOCR_IMAGE_NAME }}@sha256:%s ' *)
      - name: inspect
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

  github_release:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: [merge]
    steps:
      - uses: actions/checkout@v5
      - name: derive image version
        id: ver
        # Tag is vX.Y.Z; the published image tags drop the leading v
        # (docker/metadata-action semver pattern), so strip it for the body —
        # otherwise the notes point at ghcr...:vX.Y.Z, which does not exist.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container images for this release are dual-pushed (#907):

            ```
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            registry.digitalocean.com/developerz-ai/db-mcp-gateway:${{ steps.ver.outputs.version }}
            ```

            GHCR is the public artifact; DOCR is the in-cluster source the
            ArgoCD Image Updater tracks. See `docs/deployment/quickstart.md`
            for setup.
