name: release

on:
  push:
    tags: ["v*"]

# Per-job permissions below; nothing here needs OIDC.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # DOCR mirror — the in-cluster source the ArgoCD Image Updater tracks.
  # Per-arch builds push the image to both registries under the per-arch tag
  # `${PLATFORM_PAIR}-${version}` (e.g. `linux-amd64-1.4.5`,
  # `linux-arm64-1.4.5`); the `merge` job reads those per-arch tag refs — or,
  # when `reuse` found ci.yml's tested `sha-<7>` manifest, that manifest — and
  # imagetools-creates a single multi-arch manifest at the semver + `:latest`
  # tag set, applied to BOTH registries. The `DOCR_TOKEN` Actions secret
  # authenticates both per-arch push and the imagetools stitch.
  DOCR_REGISTRY: registry.digitalocean.com
  DOCR_IMAGE_NAME: developerz-ai/db-mcp-gateway

jobs:
  # Gate every publish on two checks, before an hour of builds: the tag must
  # name the version Cargo.toml (and so `--version`) reports, and the moving
  # tags may only move forward. A backport `v1.6.1` pushed after `v2.0.3` still
  # gets its own `1.6.1`, `1.6` and `1` tags, but must not roll `:latest` back.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.moving.outputs.latest }}
      major: ${{ steps.moving.outputs.major }}
      minor: ${{ steps.moving.outputs.minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the complete tag list the moving-tag check ranks.
          fetch-depth: 0
          persist-credentials: false
      - name: tag matches Cargo.toml version
        run: |
          set -euo pipefail
          cargo_version=$(sed -n '/^\[package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          if [ "${GITHUB_REF_NAME#v}" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version '$cargo_version'"
            exit 1
          fi
      - name: decide which moving tags this release may move
        id: moving
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          releases=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          # true when this tag is the highest release whose version starts
          # with the (regex-escaped) prefix; empty prefix = across all releases.
          newest() {
            local top
            top=$(printf '%s\n' "$releases" | grep -E "^v$1" | sort -V | tail -n1)
            [ "$top" = "$GITHUB_REF_NAME" ] && echo true || echo false
          }
          latest=false major=false minor=false
          # Prereleases and other non-X.Y.Z tags never move a floating tag.
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            minor_prefix="${version%.*}"
            latest=$(newest "")
            major=$(newest "${version%%.*}\.")
            minor=$(newest "${minor_prefix//./\\.}\.")
          fi
          echo "latest=$latest major=$major minor=$minor"
          {
            echo "latest=$latest"
            echo "major=$major"
            echo "minor=$minor"
          } >> "$GITHUB_OUTPUT"

  # The release tag lands on a commit `main` CI is already building (the tag
  # is pushed seconds after the `chore(release)` merge). Measured: every
  # release rebuilt both arches (~7-8 min each) in parallel with ci.yml
  # building the same commit, and wrote ~1.1 GB of tag-scoped gha cache that
  # no later run can read (a cache is visible only to its own ref and the
  # default branch), evicting `main`'s live entries past the 10 GB cap.
  #
  # So wait for ci.yml's push run on this commit; when it passed, its `merge`
  # published `sha-<7>` in both registries, and the release only re-tags that
  # manifest — the release digest is then exactly the digest CI tested and
  # Image Updater deployed. A red (failed/cancelled) run BLOCKS the release:
  # nothing ships from a commit CI rejected. Only two cases fall back to the
  # full build below, each with a warning naming why: no ci.yml push run for
  # this commit (a tag off `main`), or a green run whose `sha-<7>` image is
  # missing. An API error or a run still going after 40 min fails the job —
  # re-run it.
  reuse:
    needs: [preflight]
    runs-on: ubuntu-latest
    # ci.yml's push run is ~11 min p90 (build 30-min cap in parallel with
    # test's 20); the poll gives up at 40 min and falls back to building.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      found: ${{ steps.ci.outputs.found }}
    steps:
      - name: wait for ci.yml on this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fallback() {
            echo "::warning::NOT reusing a CI-tested image: $1 — building one from the tag instead"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          block() {
            echo "::error::release blocked: $1"
            exit 1
          }
          query="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main"
          deadline=$((SECONDS + 40 * 60))
          # The tag and the merge push land seconds apart; give GitHub a
          # moment to register ci.yml's run before calling it absent.
          absent_deadline=$((SECONDS + 120))
          while :; do
            if ! run=$(gh api "$query" --jq '.workflow_runs | max_by(.run_number) // {} | "\(.status // "none") \(.conclusion // "")"'); then
              block "the Actions API did not answer (re-run this job)"
            fi
            read -r status conclusion <<< "$run"
            case "$status" in
              none)
                (( SECONDS < absent_deadline )) \
                  || fallback "no ci.yml push run on main for $GITHUB_SHA" ;;
              completed) break ;;
            esac
            (( SECONDS < deadline )) || block "ci.yml still $status after 40 min (re-run this job once it finishes)"
            echo "ci.yml is $status; waiting"
            sleep 30
          done
          [ "$conclusion" = success ] \
            || block "ci.yml on $GITHUB_SHA concluded '$conclusion'; fix it and ship the next patch"
          image="$REGISTRY/$IMAGE_NAME:sha-${GITHUB_SHA::7}"
          docker buildx imagetools inspect "$image" > /dev/null \
            || fallback "$image is not in the registry"
          echo "reusing $image"
          echo "found=true" >> "$GITHUB_OUTPUT"

  # Fallback only — runs when `reuse` found no tested `main` image. Native
  # per-arch build (amd64 + arm64), each pushed at the per-arch tag, then
  # merged into one multi-arch manifest list under the semver + :latest tags.
  # Native arm64 runners replace the single-runner QEMU build that timed out
  # at 30 min (see ci.yml). The gha layer cache `main` writes (cache-from
  # below) memoises the dependency build.
  #
  # Per-arch tag pattern is intentional. Prior revision used
  # `push-by-digest=true,name-canonical=true,push=true`, which buildx reports
  # as successful but the per-arch image never materializes at the digest ref
  # in GHCR/DOCR (`MANIFEST_UNKNOWN` on a HEAD probe). `imagetools create`
  # then fails on `not found`. The per-arch tag is a known-stable ref the
  # imagetools stitch can fetch deterministically — it survives both
  # registries' round-tripping semantics.
  build:
    needs: [preflight, reuse]
    # Only when `reuse` succeeded and asked for a build; a failed `reuse` is a
    # blocked release (red CI), never a reason to build.
    if: ${{ needs.reuse.outputs.found == 'false' }}
    runs-on: ${{ matrix.runner }}
    # A release whose Cargo.lock changed busts the cached cargo layer and forces
    # a cold full recompile, which overran the old 30-min cap on arm64 (v1.2.1).
    # The 60-min ceiling covers a cold build on either GitHub-hosted runner.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            # GitHub-hosted runner: this repository is public.
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: prepare platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: derive version
        id: ver
        # Tag is vX.Y.Z; the published image tags drop the leading v
        # (docker/metadata-action semver pattern), so strip it for the body —
        # otherwise the artifact refs would point at ...:vX.Y.Z, which doesn't
        # match what the merger reads back.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build context is `.`; keep the checkout token out of the build
          # workspace (matches ci.yml's image-publish checkout).
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to ghcr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: log in to docr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.DOCR_REGISTRY }}
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}
      - name: image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCR_REGISTRY }}/${{ env.DOCR_IMAGE_NAME }}
          # Per-arch tag (e.g. `linux-amd64-1.4.5`) — declared for BOTH registries
          # so the build step can promote the labels into both `tags:` lists
          # below and produce concrete, fetchable refs at each registry. The
          # previous design only emitted per-arch labels under the GHCR image
          # base, which left the buildx `outputs:` mode publish nothing tagged
          # at all (TAG-set became empty after dropping the digest-mode flags).
          tags: |
            type=raw,value=${{ env.PLATFORM_PAIR }}-${{ steps.ver.outputs.version }}
      - name: build & push per-arch
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Read `main`'s layer cache; never write one. A tag-scoped cache is
          # readable by this ref alone, so every write was dead weight that
          # pushed `main`'s entries out of the repository's 10 GB budget.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          # Plain `tags:` + `push: true` (no `outputs:`) — buildx writes the
          # manifest AT the explicit refs and applies them to BOTH registries
          # via the comma-separated list. The previous `outputs: type=image,name=
          # ... push=true` mode silently dropped metadata tags under the v6 action
          # once name-canonical was removed, which is why per-arch refs landed as
          # untagged manifests in the first attempt of the per-arch-tag design.
          # `tags:` is the well-trodden, tested path.
          tags: ${{ steps.meta.outputs.tags }}
          push: true

  merge:
    needs: [preflight, reuse, build]
    # Runs on a reused image (`build` skipped) or a successful fallback build.
    if: ${{ !cancelled() && needs.reuse.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.reuse.outputs.found == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: derive version
        id: ver
        # Mirror the build job's derive; keep both jobs reading the same
        # semver (e.g. `1.4.5` not `v1.4.5`).
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # The per-arch image config labels are baked at build time: on the reuse
      # path they carry ci.yml's per-arch tag as `version`. Re-labelling would
      # change the digest (no longer the tested one), so the release identity
      # goes on the new index instead; `--version` reports the release anyway.
      - name: source refs
        id: src
        # Reused: the `sha-<7>` multi-arch manifest ci.yml's `merge` wrote in
        # each registry (imagetools re-tags an index as-is). Built: the two
        # per-arch refs `build` pushed.
        env:
          REUSED: ${{ needs.reuse.outputs.found }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ "$REUSED" = true ]; then
            echo "tags=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=linux-amd64-$VERSION linux-arm64-$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to ghcr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: log in to docr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.DOCR_REGISTRY }}
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}
      - name: derive ghcr image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # v1.4.5 → tags: 1.4.5, plus 1.4, 1 and latest where preflight says
          # this is the newest release in that line.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.preflight.outputs.minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ needs.preflight.outputs.major == 'true' }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.latest == 'true' }}
      - name: create ghcr manifest list & push
        env:
          SOURCE_TAGS: ${{ steps.src.outputs.tags }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          sources=()
          for tag in $SOURCE_TAGS; do sources+=("$REGISTRY/$IMAGE_NAME:$tag"); done
          annotations=(
            --annotation "index:org.opencontainers.image.version=$VERSION"
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA"
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          )
          # shellcheck disable=SC2046  # word-splitting is intentional: one -t per tag
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${annotations[@]}" "${sources[@]}"
      - name: derive docr image metadata
        id: meta-docr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCR_REGISTRY }}/${{ env.DOCR_IMAGE_NAME }}
          # mirror the GHCR tag set so the same :<semver> / :latest refs work in DOCR
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.preflight.outputs.minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ needs.preflight.outputs.major == 'true' }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.latest == 'true' }}
      - name: create docr manifest list & push
        env:
          # docker/metadata-action@v5 auto-sets only `DOCKER_METADATA_OUTPUT_JSON`
          # (shared name, no per-step suffix); with two metadata steps in the same
          # job the second overwrites the first. Mirror the DOCR step's `json`
          # output into a step-scoped env var so the jq below reads the right
          # tag set.
          DOCR_METADATA_JSON: ${{ steps.meta-docr.outputs.json }}
          SOURCE_TAGS: ${{ steps.src.outputs.tags }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          sources=()
          for tag in $SOURCE_TAGS; do sources+=("$DOCR_REGISTRY/$DOCR_IMAGE_NAME:$tag"); done
          annotations=(
            --annotation "index:org.opencontainers.image.version=$VERSION"
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA"
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          )
          # shellcheck disable=SC2046  # word-splitting is intentional: one -t per tag
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCR_METADATA_JSON") \
            "${annotations[@]}" "${sources[@]}"
      - name: inspect
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

  github_release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, merge]
    # Explicit: `merge` runs behind a skipped `build` on the reuse path, and a
    # skipped ancestor would otherwise skip this job too.
    if: ${{ !cancelled() && needs.merge.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # softprops/action-gh-release reads its own GITHUB_TOKEN via the
          # `contents: write` job permission — no need to leave the checkout
          # token in the workspace for later steps.
          persist-credentials: false
      - name: derive image version
        id: ver
        # Tag is vX.Y.Z; the published image tags drop the leading v
        # (docker/metadata-action semver pattern), so strip it for the body —
        # otherwise the notes point at ghcr...:vX.Y.Z, which does not exist.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: create github release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          # A backport must not take the "Latest release" badge either.
          make_latest: ${{ needs.preflight.outputs.latest }}
          body: |
            Container images for this release are dual-pushed:

            ```
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            registry.digitalocean.com/developerz-ai/db-mcp-gateway:${{ steps.ver.outputs.version }}
            ```

            GHCR is the public artifact; DOCR is the in-cluster source the
            ArgoCD Image Updater tracks. See `website/docs/deployment/quickstart.md`
            for setup.
