name: release

on:
  push:
    tags: ["v*"]

# Per-job permissions below; only `merge` asks for OIDC (keyless signing).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # DOCR mirror — the in-cluster source the ArgoCD Image Updater tracks. The
  # release re-tags ci.yml's tested `sha-<7>` multi-arch index in BOTH
  # registries; `DOCR_TOKEN` authenticates the DOCR probe and re-tag.
  DOCR_REGISTRY: registry.digitalocean.com
  DOCR_IMAGE_NAME: developerz-ai/db-mcp-gateway

jobs:
  # Gate every publish on three checks: the tag must be on `main` (only `main`
  # commits have a CI-tested image), it must name the version Cargo.toml (and
  # so `--version`) reports, and the moving tags may only move forward. A backport `v1.6.1` pushed after `v2.0.3` still
  # gets its own `1.6.1`, `1.6` and `1` tags, but must not roll `:latest` back.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.moving.outputs.latest }}
      major: ${{ steps.moving.outputs.major }}
      minor: ${{ steps.moving.outputs.minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the complete tag list the moving-tag check ranks.
          fetch-depth: 0
          persist-credentials: false
      # fetch-depth 0 fetches every branch, so origin/main is the remote tip.
      - name: tag is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main; release from a main commit"
            exit 1
          fi
      - name: tag matches Cargo.toml version
        run: |
          set -euo pipefail
          cargo_version=$(sed -n '/^\[package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          if [ "${GITHUB_REF_NAME#v}" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version '$cargo_version'"
            exit 1
          fi
      - name: decide which moving tags this release may move
        id: moving
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          releases=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          # true when this tag is the highest release whose version starts
          # with the (regex-escaped) prefix; empty prefix = across all releases.
          newest() {
            local top
            top=$(printf '%s\n' "$releases" | grep -E "^v$1" | sort -V | tail -n1)
            [ "$top" = "$GITHUB_REF_NAME" ] && echo true || echo false
          }
          latest=false major=false minor=false
          # Prereleases and other non-X.Y.Z tags never move a floating tag.
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            minor_prefix="${version%.*}"
            latest=$(newest "")
            major=$(newest "${version%%.*}\.")
            minor=$(newest "${minor_prefix//./\\.}\.")
          fi
          echo "latest=$latest major=$major minor=$minor"
          {
            echo "latest=$latest"
            echo "major=$major"
            echo "minor=$minor"
          } >> "$GITHUB_OUTPUT"

  # The release tag lands on a commit `main` CI already built and tested (the
  # tag is pushed seconds after the `chore(release)` merge), so the release
  # only re-tags ci.yml's `sha-<7>` manifest: the per-arch images (and their
  # digests) are exactly the ones CI tested and Image Updater deployed; only
  # the index differs, because the release adds its own annotations to it.
  #
  # Nothing else ships. No ci.yml push run for the commit, a red
  # (failed/cancelled) run, or a green run whose `sha-<7>` is missing from
  # either registry BLOCKS the release. The old build-from-the-tag fallback is
  # gone: it published an image no test had run against. An API error or a run
  # still going after 40 min fails the job — re-run it.
  reuse:
    needs: [preflight]
    runs-on: ubuntu-latest
    # ci.yml's push run is ~11 min p90 (build 30-min cap in parallel with
    # test's 20); the poll gives up at 40 min and fails the job (re-run it).
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # DOCR is private: the probe below needs a login to see `sha-<7>` there.
      - name: log in to docr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.DOCR_REGISTRY }}
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}
      # The shell only observes (Actions API, registry probes) and acts; what to
      # do with each observation is .github/scripts/release_reuse_decision.py,
      # pinned by its test in ci.yml's `scripts` job.
      - name: wait for ci.yml on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          query="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main"
          images=(
            "$REGISTRY/$IMAGE_NAME:sha-${GITHUB_SHA::7}"
            "$DOCR_REGISTRY/$DOCR_IMAGE_NAME:sha-${GITHUB_SHA::7}"
          )
          deadline=$((SECONDS + 40 * 60))
          # The tag and the merge push land seconds apart; give GitHub a
          # moment to register ci.yml's run before calling it absent.
          grace=$((SECONDS + 120))
          image_state=unchecked
          while :; do
            if ! run=$(gh api "$query" --jq '.workflow_runs | max_by(.run_number) // {} | "\(.status // "none") \(.conclusion // "-")"'); then
              echo "::error::release blocked: the Actions API did not answer (re-run this job)"
              exit 1
            fi
            read -r status conclusion <<< "$run"
            verdict=$(python3 -I .github/scripts/release_reuse_decision.py \
              "$status" "$conclusion" "$image_state" \
              "$(( SECONDS >= grace ))" "$(( SECONDS >= deadline ))")
            read -r action reason <<< "$verdict"
            case "$action" in
              wait)
                echo "$reason; waiting"
                sleep 30 ;;
              check-image)
                image_state=present
                for image in "${images[@]}"; do
                  if ! docker buildx imagetools inspect "$image" > /dev/null; then
                    echo "::warning::$image not found"
                    image_state=missing
                  fi
                done ;;
              reuse)
                echo "reusing sha-${GITHUB_SHA::7} ($reason)"
                exit 0 ;;
              block)
                echo "::error::release blocked: $reason"
                exit 1 ;;
              *)
                echo "::error::unknown reuse decision: $verdict"
                exit 1 ;;
            esac
          done

  # Re-tag the tested `sha-<7>` index under the release tags, in an order that
  # never leaves `:latest` ahead of what it names: the version tags (X.Y.Z,
  # and X.Y / X where preflight allows) land in BOTH registries first, the
  # release index is signed (cosign keyless) and its provenance attested, and
  # only then does `:latest` move — in both registries.
  merge:
    needs: [preflight, reuse]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing and the provenance attestation: the run's OIDC
      # identity is the signer.
      id-token: write
      attestations: write
    steps:
      - name: derive version
        id: ver
        # Tags are vX.Y.Z; the published image tags drop the leading v
        # (docker/metadata-action semver pattern).
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      # The per-arch image config labels are baked at build time: they carry
      # ci.yml's per-arch tag as `version`. Re-labelling would change the
      # digest (no longer the tested one), so the release identity goes on the
      # new index instead; `--version` reports the release anyway.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: log in to ghcr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: log in to docr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.DOCR_REGISTRY }}
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}
      - name: derive ghcr version tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Never an automatic `latest` (a semver rule adds one by default):
          # only the gated step below moves it, after signing.
          flavor: latest=false
          # v1.4.5 → 1.4.5, plus 1.4 and 1 where preflight says this is the
          # newest release in that line. `:latest` moves in its own step below.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.preflight.outputs.minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ needs.preflight.outputs.major == 'true' }}
      - name: derive docr version tags
        id: meta-docr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCR_REGISTRY }}/${{ env.DOCR_IMAGE_NAME }}
          # Never an automatic `latest` (a semver rule adds one by default):
          # only the gated step below moves it, after signing.
          flavor: latest=false
          # Mirror the GHCR tag set so the same refs work in DOCR.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.preflight.outputs.minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ needs.preflight.outputs.major == 'true' }}
      - name: version tags in both registries
        env:
          # docker/metadata-action sets one shared `DOCKER_METADATA_OUTPUT_JSON`
          # (the second step overwrote the first), so each registry reads its
          # own step's `json` output.
          GHCR_JSON: ${{ steps.meta.outputs.json }}
          DOCR_JSON: ${{ steps.meta-docr.outputs.json }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          annotations=(
            --annotation "index:org.opencontainers.image.version=$VERSION"
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA"
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          )
          stitch() {
            local json=$1 source=$2
            mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$json")
            docker buildx imagetools create "${tags[@]}" "${annotations[@]}" "$source"
          }
          stitch "$GHCR_JSON" "$REGISTRY/$IMAGE_NAME:$SOURCE_TAG"
          stitch "$DOCR_JSON" "$DOCR_REGISTRY/$DOCR_IMAGE_NAME:$SOURCE_TAG"
      - name: release index digests
        id: digest
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er .digest; }
          echo "ghcr=$(digest "$REGISTRY/$IMAGE_NAME:$VERSION")" >> "$GITHUB_OUTPUT"
          echo "docr=$(digest "$DOCR_REGISTRY/$DOCR_IMAGE_NAME:$VERSION")" >> "$GITHUB_OUTPUT"
      # Keyless: the signature binds the digest to this workflow run's OIDC
      # identity (`cosign verify --certificate-identity-regexp
      # 'github.com/<repo>/.github/workflows/release.yml@refs/tags/v'`).
      - name: sign the release index (cosign keyless)
        env:
          GHCR_DIGEST: ${{ steps.digest.outputs.ghcr }}
          DOCR_DIGEST: ${{ steps.digest.outputs.docr }}
        run: |
          set -euo pipefail
          cosign sign --yes "$REGISTRY/$IMAGE_NAME@$GHCR_DIGEST"
          cosign sign --yes "$DOCR_REGISTRY/$DOCR_IMAGE_NAME@$DOCR_DIGEST"
      - name: attest provenance (ghcr)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.ghcr }}
          push-to-registry: true
      - name: attest provenance (docr)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.DOCR_REGISTRY }}/${{ env.DOCR_IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.docr }}
          push-to-registry: true
      # Last, and only once every version tag exists in both registries: a
      # failure above leaves `:latest` on the previous release, never on a
      # version one registry lacks.
      - name: move :latest in both registries
        if: needs.preflight.outputs.latest == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          for repo in "$REGISTRY/$IMAGE_NAME" "$DOCR_REGISTRY/$DOCR_IMAGE_NAME"; do
            docker buildx imagetools create -t "$repo:latest" "$repo:$VERSION"
          done
      - name: inspect
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:$VERSION"

  github_release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, merge]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # softprops/action-gh-release reads its own GITHUB_TOKEN via the
          # `contents: write` job permission — no need to leave the checkout
          # token in the workspace for later steps.
          persist-credentials: false
      - name: derive image version
        id: ver
        # Tag is vX.Y.Z; the published image tags drop the leading v
        # (docker/metadata-action semver pattern), so strip it for the body —
        # otherwise the notes point at ghcr...:vX.Y.Z, which does not exist.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: create github release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          # A backport must not take the "Latest release" badge either.
          make_latest: ${{ needs.preflight.outputs.latest }}
          body: |
            Container images for this release are dual-pushed:

            ```
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            registry.digitalocean.com/developerz-ai/db-mcp-gateway:${{ steps.ver.outputs.version }}
            ```

            GHCR is the public artifact; DOCR is the in-cluster source the
            ArgoCD Image Updater tracks. See `website/docs/deployment/quickstart.md`
            for setup.
