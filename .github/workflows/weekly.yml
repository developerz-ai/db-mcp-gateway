name: weekly

# Checks off the PR path, against `main` (scheduled runs use the default
# branch). The advisory audit is daily, in audit.yml; the load gate is its own
# workflow (load-gate.yml).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Report only: what `cargo update` would move. Applying it is a reviewed PR
  # (Dependabot, or by hand narrowly — CLAUDE.md §Dependency graph; sqlx stays
  # pinned with its sqlx-sqlite stub).
  outdated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - name: cargo update --dry-run
        run: |
          set -o pipefail
          {
            echo '## cargo update --dry-run'
            echo '```'
            cargo update --dry-run --color never 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Advisory: what the published image ships that a scanner flags. Scans the
  # `:latest` multi-arch image from the public registry (no credential); a
  # HIGH/CRITICAL finding with a fixed version fails the run, for a
  # maintainer to ship as the next patch. Not a gate on anything.
  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: trivy image scan (ghcr :latest)
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          {
            echo "## trivy: $image"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          docker run --rm \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --no-progress --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$image" \
            | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # Advisory line coverage of the full suite (unit + integration against the
  # dev stack), as a report: no threshold, nothing gates on it. The number is
  # for finding untested code, not for chasing.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: start the dev stack
        run: docker compose -f docker-compose.dev.yml up -d --wait
      - name: install pinned toolchain (rust-toolchain.toml) + llvm-tools
        run: |
          rustup toolchain install --no-self-update
          rustup component add llvm-tools-preview
      - name: install cargo-llvm-cov + cargo-nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.151
      - name: coverage
        run: |
          set -o pipefail
          cargo llvm-cov nextest --all-targets --all-features --no-fail-fast \
            --lcov --output-path lcov.info
          {
            echo '## coverage (advisory, no threshold)'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore
