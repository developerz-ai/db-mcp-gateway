# cargo-audit configuration.
#
# Ignored advisories must be justified here. Re-evaluate at every dependency bump.
#
# NOTE: cargo-audit reads `.cargo/audit.toml`, not this file. This copy is the
# human-facing record and is kept in sync by hand; CI runs a bare `cargo audit`
# with no `--ignore` on the command line, so this file and the workflow's
# command line must keep matching.
#
# Nothing is ignored today. RUSTSEC-2023-0071 (rsa "Marvin Attack") is clear:
# sqlx 0.9's `mysql` feature no longer pulls `rsa`, the opt-in `mysql-rsa`
# feature Cargo.toml enables requires `^0.10.0-rc.18` → rsa 0.10.0, and the
# advisory declares `patched = [">= 0.10.0"]`.
