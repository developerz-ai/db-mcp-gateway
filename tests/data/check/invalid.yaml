# --check fixture: several independent mistakes, all reported in one run.
# `role` holds what looks like a pasted password: it must never be echoed.
gateway:
  env: production
servers:
  - name: prod
    kind: postgres
    host: db.example.internal
    tls: verify_full
    databases:
      - name: app
        role: "S3cr3t!pasted"
        password: ${ENV:CHECK_APP_RO_PASSWORD}
      - name: admin
        role: postgres
        password: literal-in-production
  - name: prod
    kind: postgres
    host: other.example.internal
    tls: verify_full
  - name: old
    kind: mysql
    host: mysql.example.internal
permissions:
  - group: engineers
    grants:
      - server: nowhere
        database: app
        action: query_read
logging:
  stream:
    - kind: syslog
      host: " "
      port: 514
