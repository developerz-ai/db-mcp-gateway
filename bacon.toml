# bacon (https://dystroy.org/bacon/) — re-runs a job on save.
#   bacon          clippy, the same flags as bin/lint
#   bacon unit     the Docker-free tests (bin/test --unit)
#   bacon test     the full suite (dev stack up)
#   bacon run      the gateway via bin/run, restarted on change
default_job = "clippy"

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets", "--all-features", "--color", "always", "--", "-D", "warnings"]
need_stdout = false

[jobs.unit]
command = ["cargo", "test", "--lib", "--bins", "--test", "it_offline", "--all-features", "--color", "always"]
need_stdout = true

[jobs.test]
command = ["bin/test"]
need_stdout = true

[jobs.run]
command = ["bin/run"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
