[package]
name = "db-mcp-gateway"
version = "1.5.0"
edition = "2024"
rust-version = "1.85"
description = "Self-hosted MCP gateway for credentialled, audited, policy-scoped database access by AI agents — read-only by default, writes opt-in per grant"
license = "MIT"
repository = "https://github.com/developerz-ai/db-mcp-gateway"
readme = "README.md"
publish = false

[[bin]]
name = "db-mcp-gateway"
path = "src/main.rs"

[features]
# Test-only helpers (e.g. `transport::test_router`, which mounts /mcp without
# bearer auth). Off by default so the auth-bypassing harness never reaches the
# normal library surface; this crate's integration tests enable it via the self
# dev-dependency below.
test-support = []
# Builds `benchmarks/harness` (see benchmarks/README.md). Off by default so the
# load generator never enters a release build or the runtime image — it exists
# to measure the gateway, not to ship with it.
bench-harness = []

[[bin]]
name = "bench-harness"
path = "benchmarks/harness/main.rs"
required-features = ["bench-harness"]

[dependencies]
# async runtime + http
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
# rustls 0.23 requires explicit CryptoProvider selection — we pick aws-lc-rs
# at boot in `transport::tls::install_crypto_provider`.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
futures = "0.3.32"            # Stream combinators for the SSE response

# serialization + config
serde = { version = "1", features = ["derive"] }
# `preserve_order` makes `serde_json::Value::Object` iterate keys in source
# order via `indexmap`. The mongo rejector (`src/exec/mongo/rejector.rs`)
# relies on this — mongo's wire convention is "the first key of the
# command document is the command name."
serde_json = { version = "1", features = ["preserve_order"] }
# Not `serde_yaml` — rationale in website/docs/initial-idea/08-config.md
# §"YAML parser". Must be parsed via `config::yaml::non_leaking_options`.
serde-saphyr = "1"
clap = { version = "4", features = ["derive", "env"] }

# db
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "uuid", "chrono", "json", "bigdecimal"] }
sqlparser = { version = "0.52", features = ["visitor"] }
async-trait = "0.1"
# Mongo target adapter (#57 scaffold + #58 exec). Disable default features so
# we never pull native-tls's openssl link; rustls matches the rest of the
# stack. Mongo is a target backend, not a permissions storage backend
# (spec 12 §"Storage backends" excludes it).
mongodb = { version = "3.7", default-features = false, features = ["rustls-tls-aws-lc", "dns-resolver", "compat-3-3-0", "bson-3"] }

# auth / crypto
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
# PKCE S256 for the MCP OAuth bridge: base64url-no-pad(sha256(verifier))
# compared against the client's code_challenge.
sha2 = "0.10"
base64 = "0.22"
# DB-credential hygiene: keep resolved passwords in a heap buffer that zeroes
# on drop and refuses to `Debug`-print in the clear. `secrecy::SecretString`
# wraps the value end to end; `&str` is exposed only at the driver boundary.
# `zeroize` is used directly to scrub the file-read buffer in `Password::resolve`.
secrecy = "0.10"
zeroize = "1"

# errors + tracing
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Non-blocking stdout writer for the JSON-per-line subscriber. `tracing`
# `info!` calls on the request path (including the `audit_stream` fan-out in
# `src/audit/stream.rs`) must never block on a slow stdout consumer —
# CLAUDE.md §"Async end-to-end" rules out blocking I/O in async fns.
# `non_blocking` spawns a dedicated worker thread; the returned `WorkerGuard`
# is held for the process lifetime and flushes the queue on drop.
tracing-appender = "0.2"

# metrics — facade + Prometheus exporter for /metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# ids + time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# error tracking → GlitchTip (Sentry-protocol ingest). Error tracking ONLY:
# no tracing/perf integration, no native-tls, no bare transport. reqwest
# transport pinned to rustls to match the rest of the stack (aws-lc-rs) and
# keep openssl out of the dep graph — see `cargo tree -i openssl-sys` (empty).
# DSN is read from SENTRY_DSN at runtime; unset → disabled no-op client.
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
# credential-scrubbing regexes for the sentry `before_send` hook. No `unicode`
# feature: DSN/password patterns are ASCII, keeping the dep light.
regex = { version = "1", default-features = false }

[dev-dependencies]
# Self dev-dependency: enables `test-support` for this crate's own integration
# tests (feature unification) without exposing it to downstream consumers.
db-mcp-gateway = { path = ".", features = ["test-support"] }
proptest = "1"
serial_test = "3"            # Serialize real-DB tests that share one global table (cap, GC)
tempfile = "3"
rcgen = "0.13"                # Self-signed certs for the TLS+SIGHUP integration test
libc = "0.2"                  # `raise(SIGHUP)` from the integration test (in-process signal)

# 29 integration-test binaries plus the lib each carried full DWARF: measured
# 188MB of a 244MB test binary, and a 43GB target/ dir. The linker copies all
# of it verbatim, once per binary, on every link. `line-tables-only` keeps
# file:line in backtraces (RUST_BACKTRACE=1 is set in CI) while dropping the
# type/variable tables nothing here reads; `unpacked` leaves the rest in the .o
# files instead of copying it into each executable.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Dependencies are built once and then only executed — by the 19 tests that
# drive a real database. Optimising them costs nothing on rebuild and makes
# those runs meaningfully faster.
[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
