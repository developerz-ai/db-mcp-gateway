# The workspace exists for one extra member: `third_party/sqlx-sqlite-noop`, a
# no-op stand-in for sqlx's optional SQLite driver (see `[patch.crates-io]`).
# It has to be a workspace member because `cargo chef` — which the Dockerfile
# uses to cache dependencies — restores only workspace members into its builder
# stage, and the root manifest's patch has to resolve there.
[workspace]
members = ["third_party/sqlx-sqlite-noop"]

[package]
name = "db-mcp-gateway"
version = "1.6.0"
edition = "2024"
rust-version = "1.88"
description = "Self-hosted MCP gateway for credentialled, audited, policy-scoped database access by AI agents — read-only by default, writes opt-in per grant"
license = "MIT"
repository = "https://github.com/developerz-ai/db-mcp-gateway"
readme = "README.md"
publish = false

[[bin]]
name = "db-mcp-gateway"
path = "src/main.rs"

[features]
# Test-only helpers (e.g. `transport::test_router`, which mounts /mcp without
# bearer auth). Off by default so the auth-bypassing harness never reaches the
# normal library surface; this crate's integration tests enable it via the self
# dev-dependency below.
test-support = []
# Builds `benchmarks/harness` (see benchmarks/README.md). Off by default so the
# load generator never enters a release build or the runtime image — it exists
# to measure the gateway, not to ship with it.
bench-harness = []

[[bin]]
name = "bench-harness"
path = "benchmarks/harness/main.rs"
required-features = ["bench-harness"]

[dependencies]
# async runtime + http
# Named features, not "full": the runtime, timers, sockets, signals, locks and
# the one async file read (`config::secret`). Add a feature when code needs it.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs"] }
axum = { version = "0.7", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
# rustls 0.23 requires explicit CryptoProvider selection — we pick aws-lc-rs
# at boot in `transport::tls::install_crypto_provider`.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
tower = "0.5"
futures = "0.3.32"            # Stream combinators for the SSE response

# serialization + config
serde = { version = "1", features = ["derive"] }
# `preserve_order` makes `serde_json::Value::Object` iterate keys in source
# order via `indexmap`. The mongo rejector (`src/exec/mongo/rejector.rs`)
# relies on this — mongo's wire convention is "the first key of the
# command document is the command name."
serde_json = { version = "1", features = ["preserve_order"] }
# Not `serde_yaml` — rationale in website/docs/initial-idea/08-config.md
# §"YAML parser". Must be parsed via `config::yaml::non_leaking_options`.
serde-saphyr = "1"
clap = { version = "4", features = ["derive", "env"] }

# db
# `default-features = false` drops sqlx's default `any` feature: the gateway
# targets Postgres and MySQL (Mongo is a separate adapter) and no `sqlx::any`
# API is used. Every feature the default set supplied — `macros`, `migrate`,
# `json` — is named explicitly below, so `any` is the only thing lost.
# `macros` and `migrate` are load-bearing: `sqlx::migrate!` and the
# `#[derive(sqlx::FromRow)]` uses need them, and `sqlx::migrate!` expands to
# `::sqlx::migrate::…`, so the umbrella's `migrate` feature cannot be dropped.
#
# The optional SQLite driver is a separate matter: sqlx keeps `sqlx-sqlite` as
# an optional dependency, and Cargo.lock materialises an optional dependency as
# soon as an enabled feature references it — even by a weak `dep?/feat`
# reference. sqlx's `migrate`/`json`/`chrono`/`uuid` features each reference
# `sqlx-sqlite?/…`, so the driver lands in the lock (with `libsqlite3-sys`
# 0.30.1, flagged by RUSTSEC-2026-0459) even though the `sqlite` feature is
# off and the driver is never compiled. No sqlx release can carry a fixed
# `libsqlite3-sys` — sqlx-sqlite 0.8.6 requires `^0.30.1` and the fix landed
# in 0.39.0 — so the driver is stood in for by a no-op stub; see
# `[patch.crates-io]` below.
#
# The version is pinned exactly, not to a range: the stub satisfies only
# sqlx's `sqlx-sqlite = "=0.8.6"` requirement, so a `cargo update` that moved
# sqlx to 0.8.7 would leave the patch unused — the real driver, and
# `libsqlite3-sys` with it, would return to the lock and RUSTSEC-2026-0459
# with them. Bump sqlx and the stub's version in the same commit.
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "macros", "migrate", "json", "postgres", "mysql", "uuid", "chrono", "bigdecimal"] }
sqlparser = { version = "0.63", features = ["visitor"] }
async-trait = "0.1"
# Mongo target adapter (#57 scaffold + #58 exec). Disable default features so
# we never pull native-tls's openssl link; rustls matches the rest of the
# stack. Mongo is a target backend, not a permissions storage backend
# (spec 12 §"Storage backends" excludes it).
mongodb = { version = "3.7", default-features = false, features = ["rustls-tls-aws-lc", "dns-resolver", "compat-3-3-0", "bson-3"] }

# auth / crypto
jsonwebtoken = "9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "query"] }
url = "2"
# PKCE S256 for the MCP OAuth bridge: base64url-no-pad(sha256(verifier))
# compared against the client's code_challenge.
sha2 = "0.11"
base64 = "0.23"
# DB-credential hygiene: keep resolved passwords in a heap buffer that zeroes
# on drop and refuses to `Debug`-print in the clear. `secrecy::SecretString`
# wraps the value end to end; `&str` is exposed only at the driver boundary.
# `zeroize` is used directly to scrub the file-read buffer in `Password::resolve`.
secrecy = "0.10"
zeroize = "1"

# errors + tracing
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Non-blocking stdout writer for the JSON-per-line subscriber. `tracing`
# `info!` calls on the request path (including the `audit_stream` fan-out in
# `src/audit/stream.rs`) must never block on a slow stdout consumer —
# CLAUDE.md §"Async end-to-end" rules out blocking I/O in async fns.
# `non_blocking` spawns a dedicated worker thread; the returned `WorkerGuard`
# is held for the process lifetime and flushes the queue on drop.
tracing-appender = "0.2"

# metrics — facade + Prometheus exporter for /metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# ids + time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# error tracking → GlitchTip (Sentry-protocol ingest). Error tracking ONLY:
# no tracing/perf integration, no native-tls, no bare transport. reqwest
# transport pinned to rustls to match the rest of the stack (aws-lc-rs) and
# keep openssl out of the dep graph — see `cargo tree -i openssl-sys` (empty).
# DSN is read from SENTRY_DSN at runtime; unset → disabled no-op client.
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
# credential-scrubbing regexes for the sentry `before_send` hook. The full
# `unicode` feature stays off (the patterns are ASCII), but every feature those
# patterns *use* must be named here: `unicode-case` for `(?i)`, `unicode-perl`
# for `\w` / `\s` / `\b`. Both were previously absent and arrived only by
# accident — `unicode-case` from a dev-dependency (so `cargo test` was green)
# and `unicode-perl` from sentry-backtrace. The shipping build has no
# dev-dependencies, so `(?i)` failed to compile there and the scrubber fell
# back to redacting every string: 40 GlitchTip events, each one
# `***REDACTED***: ***REDACTED***`. `bin/lint` now asserts both features are
# present in the no-dev-dependency graph.
regex = { version = "1", default-features = false, features = [
  "std",
  "unicode-case",
  "unicode-perl",
] }

[dev-dependencies]
# Self dev-dependency: enables `test-support` for this crate's own integration
# tests (feature unification) without exposing it to downstream consumers.
db-mcp-gateway = { path = ".", features = ["test-support"] }
proptest = "1"
serial_test = "3"            # Serialize real-DB tests that share one global table (cap, GC)
tempfile = "3"
rcgen = "0.14"                # Self-signed certs for the TLS+SIGHUP integration test
libc = "0.2"                  # `raise(SIGHUP)` from the integration test (in-process signal)

# 29 integration-test binaries plus the lib each carried full DWARF: measured
# 188MB of a 244MB test binary, and a 43GB target/ dir. The linker copies all
# of it verbatim, once per binary, on every link. `line-tables-only` keeps
# file:line in backtraces (RUST_BACKTRACE=1 is set in CI) while dropping the
# type/variable tables nothing here reads; `unpacked` leaves the rest in the .o
# files instead of copying it into each executable.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Dependencies are built once and then only executed — by the 19 tests that
# drive a real database. Optimising them costs nothing on rebuild and makes
# those runs meaningfully faster.
[profile.dev.package."*"]
opt-level = 1
debug = false

# CI builds once per job and never rebuilds incrementally, so incremental state
# is wasted disk and cache upload; without DWARF the ~40 test binaries link
# faster and the rust-cache archive shrinks. Backtraces keep function names.
[profile.ci]
inherits = "dev"
debug = false
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Cargo.lock materialises optional dependencies that enabled features reference,
# even weakly (`sqlx-sqlite?/…`). sqlx's `migrate`/`json`/`chrono`/`uuid`
# features each reference the optional SQLite driver, so it lands in the lock
# with `libsqlite3-sys` 0.30.1 and RUSTSEC-2026-0459 fires — even though the
# `sqlite` feature is never enabled and the driver is never compiled.
# No sqlx release can carry a fixed `libsqlite3-sys`: sqlx-sqlite 0.8.6 requires
# `^0.30.1`, sqlx-sqlite 0.9.0 still caps at `<0.38.0`, and the fix landed in
# 0.39.0. The stub below stands in for the driver so the vulnerable crate
# leaves the lock; no gate compiles it, because the `sqlite` feature is off and
# the stub is not a default workspace member (CLAUDE.md §"Dependency graph").
[patch.crates-io]
sqlx-sqlite = { path = "third_party/sqlx-sqlite-noop" }
