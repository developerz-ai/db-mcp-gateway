[package]
name = "db-mcp-gateway"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Self-hosted MCP gateway for credentialled, audited, read-only database access by AI agents"
license = "MIT"
repository = "https://github.com/developerz-ai/db-mcp-gateway"
readme = "README.md"
publish = false

[[bin]]
name = "db-mcp-gateway"
path = "src/main.rs"

[dependencies]
# async runtime + http
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
futures = "0.3.32"            # Stream combinators for the SSE response

# serialization + config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }

# db
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
sqlparser = "0.52"

# auth / crypto
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"

# errors + tracing
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# metrics — facade + Prometheus exporter for /metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# ids + time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
