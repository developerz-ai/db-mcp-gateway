# cargo-audit configuration.
#
# RUSTSEC-2023-0071 — "Marvin Attack" timing side-channel in the `rsa` crate.
# Pulled in transitively via sqlx-macros-core -> sqlx-mysql. This gateway is
# Postgres-only and never executes the MySQL auth handshake that uses `rsa`, so
# the vulnerable code path is unreachable. No fixed upstream version exists.
# Revisit when sqlx ships a fix or drops the unconditional MySQL driver dep.
[advisories]
ignore = ["RUSTSEC-2023-0071"]
