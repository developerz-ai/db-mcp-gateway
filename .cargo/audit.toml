# cargo-audit configuration.
#
# RUSTSEC-2023-0071 — "Marvin Attack" timing side-channel in the `rsa` crate —
# is CLEAR as of the sqlx 0.9 upgrade: sqlx 0.9's `mysql` feature no longer
# pulls `rsa`, and the new opt-in `mysql-rsa` feature (which Cargo.toml enables
# because the non-TLS `mysql:8` dev DSN needs caching_sha2_password full auth)
# requires `^0.10.0-rc.18`, resolved to rsa 0.10.0. The advisory declares
# `patched = [">= 0.10.0"]`, so there is nothing left to ignore here.
#
# The `rsa` path is still reached only by the caching_sha2_password /
# sha256_password handshake on a connection that is not already TLS-wrapped —
# a PERMISSIONS_DB_DSN with `ssl-mode=REQUIRED` avoids it. That is a hardening
# note, not an advisory: no `[advisories] ignore` entry covers it.
