# cargo-audit configuration.
#
# No advisory is ignored. RUSTSEC-2023-0071 ("Marvin Attack" timing
# side-channel in the `rsa` crate, reached through sqlx-mysql) was ignored
# here until the sqlx 0.9 upgrade: sqlx 0.9's opt-in `mysql-rsa` feature
# resolves to `rsa` 0.10, the release the advisory declares patched.
#
# sqlx-mysql still uses `rsa` only to encrypt the password during the
# `caching_sha2_password` / `sha256_password` handshake on a connection that
# is not TLS-wrapped; a PERMISSIONS_DB_DSN with `ssl-mode=REQUIRED` never
# reaches it.
