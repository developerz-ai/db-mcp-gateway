# cargo-audit configuration.
#
# RUSTSEC-2023-0071 — "Marvin Attack" timing side-channel in the `rsa` crate,
# reached through sqlx-mysql.
#
# The previous justification here claimed this gateway is "Postgres-only" and
# that the MySQL auth handshake never executes. That is no longer true:
# Cargo.toml enables sqlx's `mysql` feature deliberately, MySQL is a supported
# `permissions_store.driver`, and tests/it_db/permissions_repo_mysql.rs exercises it
# against a live server in CI.
#
# Accurate status: `rsa` is used by sqlx-mysql only to encrypt the password
# during the `caching_sha2_password` / `sha256_password` handshake, and only
# when the connection is not already TLS-wrapped. An operator who sets
# `ssl-mode=REQUIRED` in PERMISSIONS_DB_DSN never reaches it. We do not yet
# force that, so the path stays reachable under misconfiguration.
#
# `rsa` 0.10 is published, but it requires the sqlx 0.9 upgrade path. sqlx 0.9
# requires Rust 1.94 while this project declares MSRV 1.88, so the current
# sqlx 0.8 dependency retains rsa 0.9.10. Keep this advisory ignored until the
# project raises its MSRV to at least Rust 1.94 and upgrades sqlx; then remove
# the ignore and re-resolve the dependency.
[advisories]
ignore = ["RUSTSEC-2023-0071"]
