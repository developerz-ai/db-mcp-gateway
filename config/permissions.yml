# Deployable gateway config for one shared Postgres cluster fronted by pgcat.
#
# Mounted as a secret at /etc/gateway/config.yml (#17). The IdP's `groups`
# claim feeds the `permissions:` group names below (devs / devops / cto);
# mapping people to groups is the IdP's job — collective ownership in v1.
#
# Schema: website/docs/initial-idea/08-config.md.
# Spec for grants + constraint merge: website/docs/initial-idea/06-permissions.md.

servers:
  - name: shared-pg
    kind: postgres
    description: "Shared Postgres cluster, fronted by pgcat"
    # In-cluster route: gateway → pgcat → postgres; nothing connects to the
    # primary directly. The pod ↔ pgcat ↔ postgres legs are all
    # cluster-internal mesh traffic, so TLS terminates at the gateway's public
    # ingress (Traefik) and the per-DB legs are plain.
    host: pgcat.pgcat.svc.cluster.local
    port: 6432
    tls: insecure
    databases:
      # App DBs. Each RO role is provisioned out-of-band by the deployment;
      # the gateway never creates roles.
      - name: orders
        role: mcp_gateway_orders_ro
        password: ${FILE:/run/secrets/shared-pg/orders_ro}
        description: "orders app DB"

      - name: billing
        role: mcp_gateway_billing_ro
        password: ${FILE:/run/secrets/shared-pg/billing_ro}
        description: "billing app DB"

      # Infra-side DBs — cto-only.
      - name: idp
        role: mcp_gateway_idp_ro
        password: ${FILE:/run/secrets/shared-pg/idp_ro}
        description: "SSO IdP state"

      - name: vault
        role: mcp_gateway_vault_ro
        password: ${FILE:/run/secrets/shared-pg/vault_ro}
        description: "password vault state"

permissions:
  # devs: read-only on every app DB. Per-dev DB ownership isn't expressible in
  # the group-based model; revisit if scope demands it (see issue #19 thread).
  - group: devs
    grants:
      - server: shared-pg
        database: orders
        action: query_read
        constraints: &app_db_caps
          statement_timeout_ms: 30000
          row_limit: 10000
      - server: shared-pg
        database: billing
        action: query_read
        constraints: *app_db_caps

  # devops: same surface as devs in v1. Distinct group so we can diverge later
  # (e.g. infra-DB schema_read, longer timeouts) without rewriting dev grants.
  - group: devops
    grants:
      - server: shared-pg
        database: orders
        action: query_read
        constraints: *app_db_caps
      - server: shared-pg
        database: billing
        action: query_read
        constraints: *app_db_caps

  # cto: app DBs + infra-side DBs. Still read-only; writes are out of scope for v1.
  - group: cto
    grants:
      - server: shared-pg
        database: "*"
        action: query_read
        constraints: *app_db_caps
