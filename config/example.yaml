# Example gateway config. Copy to config.yaml, fill in, point the gateway at it with --config.
# Schema and validation rules: website/docs/initial-idea/08-config.md
#
# Secret references (resolved at startup; unresolved refs abort boot):
#   ${ENV:VAR_NAME}           process environment lookup
#   ${FILE:/run/secrets/foo}  file contents (sealed-secret mount, k8s file projection, etc.)
#   vault:secret/path         secret backend — recognised, not implemented (boot aborts)
#   aws-sm:arn:...            secret backend — recognised, not implemented (boot aborts)
#   gcp-sm:projects/...       secret backend — recognised, not implemented (boot aborts)
# Anything else is taken as an inline literal (dev/test only).

gateway:
  bind: 0.0.0.0:8443
  external_url: https://db.internal.example.com
  env: production              # 'production' rejects inline literal secrets
  state_db:
    url: ${ENV:STATE_DB_URL}
    pool_size: 10

auth:
  oidc:
    issuer: https://example.okta.com
    client_id: ${ENV:OIDC_CLIENT_ID}
    client_secret: ${ENV:OIDC_CLIENT_SECRET}
    groups_claim: groups
    session_ttl_hours: 8

servers:
  - name: prod
    kind: postgres
    host: prod-rw.db.internal
    port: 5432
    tls: required
    databases:
      - name: app
        role: mcp_gateway_prod_app_ro
        password: vault:secret/prod/db/app_ro_password
        description: "Main customer-facing app DB"
        # `sql_capture` and `pool:` are in the spec but not yet enforced.
        # Parser rejects them until the features ship. See website/docs/initial-idea/08-config.md.
        # sql_capture: redacted          # planned: full | redacted | metadata_only
        # pool:
        #   max_connections: 5
        #   idle_timeout_seconds: 300
        #   acquire_timeout_seconds: 10

      - name: billing
        role: mcp_gateway_prod_billing_ro
        password: vault:secret/prod/db/billing_ro_password
        # sql_capture: metadata_only      # planned — see comment above
        # pool: { max_connections: 3 }

  - name: staging
    kind: postgres
    host: staging.db.internal
    port: 5432
    tls: required
    databases:
      - name: app
        role: mcp_gateway_staging_app_ro
        # File mount: pair with a Kubernetes Secret + volumeMount or a
        # sealed-secret. Refer to deployment docs for the helm/kustomize bit.
        password: ${FILE:/run/secrets/staging-app-ro-password}
        # pool: { max_connections: 5 }    # planned — see comment above

  # Analytics server with a write-capable sandbox DB. The role below actually
  # holds INSERT/UPDATE/DELETE on `sandbox` — writes need BOTH a `query_write`
  # grant (see permissions) AND a write-privileged DB role. Grant this role only
  # DML, never DDL: the gateway blocks schema changes, but least-privilege at
  # the DB is the primary control.
  - name: analytics
    kind: postgres
    host: analytics.db.internal
    port: 5432
    tls: required
    databases:
      - name: sandbox
        role: mcp_gateway_analytics_sandbox_rw
        password: vault:secret/analytics/db/sandbox_rw_password
        description: "Scratch DB — data-platform writers land here"

# Spec 12 §"Admin API". Default off — turn on only when you need the
# SSO-gated runtime CRUD over `/admin/v1/*`. Required when on:
#   group — the SSO claim that authorizes admin calls.
#
# session_max_age_secs (optional, default: no cap):
#   Reject admin requests from sessions older than this limit, forcing
#   re-authentication. Caps the window where a user removed from the admin
#   group in the IdP can still reach `/admin/*`. Group membership is frozen at
#   login time, so without this cap a removed admin retains access until their
#   full session expires (auth.oidc.session_ttl_hours, default 8 h). Example:
#   3600 = admin access expires 1 h after login regardless of session TTL.
#   Absent / omitted = no cap (rely on session_ttl_hours + explicit revocation).
# admin:
#   enabled: true
#   group: db-mcp-gateway-admins
#   session_max_age_secs: 3600   # optional: tighten admin group staleness bound

permissions:
  - group: backend-engineers
    grants:
      - { server: staging, database: "*", action: query_read }
      - { server: prod,    database: "*", action: schema_read }

  - group: oncall
    grants:
      - server: prod
        database: "*"
        action: query_read
        constraints:
          require_reason: true
          statement_timeout_ms: 5000
          row_limit: 1000

  - group: data-platform
    grants:
      - server: prod
        database: app
        action: query_read
        constraints:
          row_limit: 10000

  # Writes are opt-in per (server, database) via `action: query_write`. This
  # permits single-statement INSERT / UPDATE / DELETE on the named DB only —
  # data writes, never schema changes (CREATE/ALTER/DROP/TRUNCATE stay blocked).
  # The target-DB role for that database must ALSO hold write privileges; the
  # gateway does not provision them. `require_reason` is recommended so every
  # mutation is justified in the audit log.
  - group: data-platform-writers
    grants:
      - server: analytics
        database: sandbox
        action: query_write
        constraints:
          require_reason: true

  # Service-token group (spec 14). Each entry is the single permissions
  # group a `service_accounts:` token acts as. Empty `grants:` is valid —
  # it recognizes a group that authorizes nothing (authentication never
  # implies authorization).
  - group: svc-ci-bot
    grants: []

# Spec 14 — service tokens: static bearer credentials for headless clients
# (CI jobs, agent runners) that cannot drive the browser SSO flow. Each entry
# is a name (audit identity `service:<name>`), exactly one permissions group
# (declared above; convention: `svc-<name>`), and a secret REFERENCE — never
# the token value. Mint with `bin/mint-service-token <name>`; the value must
# start with `dbmcp_svc_`. Boot aborts if the group is missing from
# `permissions:` or equals the admin group. There is no in-band lifecycle:
# rotate/revoke = update the secret + edit this list + roll the deployment.
# service_accounts:
#   - name: ci-bot
#     group: svc-ci-bot
#     token: ${ENV:SERVICE_TOKEN_CI_BOT}

# Hot-tier retention (the pruner's TTL) is still env-driven — AUDIT_RETENTION_DAYS,
# default 90 — pending #16's full config-to-YAML migration. `logging.stream` below is
# real; `archive` (S3/GCS/Azure) and the `syslog`/`otlp` stream kinds are roadmap
# Phase 4 (#218) and are NOT valid config yet — the parser rejects unknown keys.
logging:
  stream:
    - kind: stdout   # emits the full audit row as a `target: "audit_stream"`
                      # tracing event, distinct from the operational log lines.
