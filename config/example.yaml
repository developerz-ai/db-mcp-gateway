# Example gateway config. Copy to config.yml, fill in, point the gateway at it with --config.
# Every secret below is an ${ENV:…} reference, so a copy boots once these are set:
#   PROD_APP_RO_PASSWORD, PROD_BILLING_RO_PASSWORD, STAGING_APP_RO_PASSWORD,
#   ANALYTICS_SANDBOX_RO_PASSWORD, ANALYTICS_SANDBOX_RW_PASSWORD
# (target pools open lazily: the hosts are not contacted at boot).
# Schema and validation rules: website/docs/initial-idea/08-config.md
#
# Secret references (resolved at startup; unresolved refs abort boot):
#   ${ENV:VAR_NAME}           process environment lookup
#   ${FILE:/run/secrets/foo}  file contents (sealed-secret mount, k8s file projection, etc.)
#   vault:secret/path         secret backend — recognised, not implemented (boot aborts)
#   aws-sm:arn:...            secret backend — recognised, not implemented (boot aborts)
#   gcp-sm:projects/...       secret backend — recognised, not implemented (boot aborts)
# Anything else is taken as an inline literal (dev/test only).

# Listener, state DB, TLS and OIDC settings are environment variables, not YAML
# (GATEWAY_BIND, METRICS_BIND, STATE_DB_URL, STATE_DB_POOL_SIZE, TLS_*, OIDC_*) —
# see website/docs/deployment/. Every key in this file is checked at boot: an
# unknown or misspelled key aborts startup.
gateway:
  env: production              # 'production' rejects inline literal secrets

servers:
  - name: prod
    kind: postgres
    host: prod-rw.db.internal
    port: 5432
    tls: required
    databases:
      - name: app
        role: mcp_gateway_prod_app_ro
        password: ${ENV:PROD_APP_RO_PASSWORD}
        description: "Main customer-facing app DB"
        # `sql_capture` is in the spec but not yet enforced; the parser rejects it.
        # sql_capture: redacted          # planned: full | redacted | metadata_only
        # Optional per-database pool sizing; overrides the server's `pool:` per
        # field. min <= max; max_connections and idle_timeout_s are non-zero.
        pool:
          max_connections: 5
          min_connections: 0
          idle_timeout_s: 300

      - name: billing
        role: mcp_gateway_prod_billing_ro
        password: ${ENV:PROD_BILLING_RO_PASSWORD}
        # sql_capture: metadata_only      # planned — see comment above
        pool: { max_connections: 3 }

  - name: staging
    kind: postgres
    host: staging.db.internal
    port: 5432
    tls: required
    databases:
      - name: app
        role: mcp_gateway_staging_app_ro
        # In Kubernetes prefer a file mount (Secret volume or sealed-secret):
        #   password: ${FILE:/run/secrets/staging-app-ro-password}
        # A file ref is re-read on SIGHUP; an env ref needs a pod restart.
        password: ${ENV:STAGING_APP_RO_PASSWORD}
        pool: { max_connections: 5 }

  # Analytics server with a write-capable sandbox DB. Two roles, two pools:
  # every read (any grant) connects as `role`, which holds SELECT only; a
  # `query_write` grant runs as `write_role`, which holds INSERT/UPDATE/DELETE.
  # Writes need BOTH a `query_write` grant (see permissions) AND `write_role` —
  # boot aborts on a `query_write` grant for a database without one. The two
  # roles must differ. Grant the write role only DML, never DDL: the gateway
  # blocks schema changes, but least-privilege at the DB is the primary
  # control. The gateway never provisions either role (postgres only).
  - name: analytics
    kind: postgres
    host: analytics.db.internal
    port: 5432
    tls: required
    databases:
      - name: sandbox
        role: mcp_gateway_analytics_sandbox_ro
        password: ${ENV:ANALYTICS_SANDBOX_RO_PASSWORD}
        write_role: mcp_gateway_analytics_sandbox_rw
        write_password: ${ENV:ANALYTICS_SANDBOX_RW_PASSWORD}
        description: "Scratch DB — data-platform writers land here"

  # YugabyteDB (YSQL) is a Postgres target: declare it `kind: postgres`. Its
  # default YSQL port is 5433, so set `port:` (an omitted port means 5432).
  # Use a least-privilege role, not the `yugabyte` superuser — the boot
  # superuser check only knows `postgres` for this kind. Point `host` at a
  # single tserver, not a load balancer: backend pids are node-local, so a
  # cancel routed to another tserver finds nothing and the query runs on
  # until its statement timeout.
  # - name: ledger
  #   kind: postgres
  #   host: yb-tserver-1.db.internal
  #   port: 5433
  #   tls: verify_full
  #   databases:
  #     - name: ledger
  #       role: mcp_gateway_ledger_ro
  #       password: ${ENV:LEDGER_RO_PASSWORD}

  # Redis-protocol target (Redis, Dragonfly, Valkey, KeyDB). Read-only
  # whatever the grant: `run_query` takes a JSON argv such as
  # ["HGETALL","user:1"] and only read commands pass. `databases[].name` is
  # the logical DB index ("0", "1", …; grants address it as prod-cache/0).
  # `role` is an ACL user — `default` aborts boot — and that ACL user is where
  # keys are scoped, e.g.
  #   ACL SETUSER gateway_ro on >*** resetkeys %R~app:* resetchannels -@all +@read -keys
  # ACL key patterns do not hide key NAMES from SCAN/DBSIZE: add `-scan -dbsize`
  # when names are sensitive, and `+select` for a DB index other than 0.
  # `tls: required` and `verify_full` both verify the certificate on redis.
  # No `auth_database` or `write_role` on redis (both abort boot). Port
  # defaults to 6379. See website/docs/deployment/config-reference.md#redis.
  # - name: prod-cache
  #   kind: redis
  #   host: cache.db.internal
  #   tls: verify_full
  #   databases:
  #     - name: "0"
  #       role: gateway_ro
  #       password: ${FILE:/run/secrets/redis-gateway-ro-password}
  #       pool: { max_connections: 4 }

# Spec 12 §"Admin API". Default off — turn on only when you need the
# SSO-gated runtime CRUD over `/admin/v1/*`. Required when on:
#   group — the SSO claim that authorizes admin calls.
#
# session_max_age_secs (optional, default: no cap):
#   Reject admin requests from sessions older than this limit, forcing
#   re-authentication. Caps the window where a user removed from the admin
#   group in the IdP can still reach `/admin/*`. Group membership is frozen at
#   login time, so without this cap a removed admin retains access until their
#   full session expires (SESSION_TTL_HOURS env, default 8 h). Example:
#   3600 = admin access expires 1 h after login regardless of session TTL.
#   Absent / omitted = no cap (rely on session_ttl_hours + explicit revocation).
# admin:
#   enabled: true
#   group: db-mcp-gateway-admins
#   session_max_age_secs: 3600   # optional: tighten admin group staleness bound

permissions:
  - group: backend-engineers
    grants:
      - { server: staging, database: "*", action: query_read }
      - { server: prod,    database: "*", action: schema_read }

  - group: oncall
    grants:
      - server: prod
        database: "*"
        action: query_read
        constraints:
          require_reason: true
          statement_timeout_ms: 5000
          row_limit: 1000

  - group: data-platform
    grants:
      - server: prod
        database: app
        action: query_read
        constraints:
          row_limit: 10000

  # Writes are opt-in per (server, database) via `action: query_write`. This
  # permits single-statement INSERT / UPDATE / DELETE on the named DB only —
  # data writes, never schema changes (CREATE/ALTER/DROP/TRUNCATE stay blocked).
  # The database must declare a `write_role` holding write privileges; the
  # gateway does not provision it. `require_reason` is recommended so every
  # mutation is justified in the audit log.
  - group: data-platform-writers
    grants:
      - server: analytics
        database: sandbox
        action: query_write
        constraints:
          require_reason: true

  # Service-token group (spec 14). Each entry is the single permissions
  # group a `service_accounts:` token acts as. Empty `grants:` is valid —
  # it recognizes a group that authorizes nothing (authentication never
  # implies authorization).
  - group: svc-ci-bot
    grants: []

# Spec 14 — service tokens: static bearer credentials for headless clients
# (CI jobs, agent runners) that cannot drive the browser SSO flow. Each entry
# is a name (audit identity `service:<name>`), exactly one permissions group
# (declared above; convention: `svc-<name>`), and a secret REFERENCE — never
# the token value. Mint with `bin/mint-service-token <name>`; the value must
# start with `dbmcp_svc_`. Boot aborts if the group is missing from
# `permissions:` or equals the admin group. There is no in-band lifecycle:
# rotate/revoke = update the secret and/or edit this list, then SIGHUP — a
# reload rebuilds every token, so `${FILE:…}` refs rotate in place. `${ENV:…}`
# refs are fixed per process: rotating one still needs a deployment roll.
#
# max_concurrent_requests (optional, default: MAX_CONCURRENT_PER_IDENTITY, 16):
#   in-flight cap for this token, replacing the per-identity cap so a fleet of
#   agents behind one token is not throttled as one user. The global cap
#   (MAX_CONCURRENT_REQUESTS) still applies. Non-zero.
# require_upstream (optional, default false): reject calls without the
#   `x-dbmcp-run-id` and `x-dbmcp-on-behalf-of` headers. Those headers are
#   claimed by the caller, stored on the audit row, never verified and never
#   used for authorization; the audit identity stays `service:<name>`.
# service_accounts:
#   - name: ci-bot
#     group: svc-ci-bot
#     token: ${ENV:SERVICE_TOKEN_CI_BOT}
#     max_concurrent_requests: 64
#     require_upstream: true

# Hot-tier retention (the pruner's TTL) is still env-driven — AUDIT_RETENTION_DAYS,
# default 90 — pending #16's full config-to-YAML migration. `logging.stream` below is
# real for `stdout` and `syslog`; `archive` (S3/GCS/Azure) and the `otlp` stream kind
# are roadmap Phase 4 (#218) and are NOT valid config yet — the parser rejects them.
logging:
  stream:
    - kind: stdout      # emits the full audit row as a `target: "audit_stream"`
                         # tracing event, distinct from the operational log lines.
    - kind: syslog       # RFC 5424 over UDP — fire-and-forget, never blocks a request.
      host: syslog.internal
      port: 514
