# cargo-nextest config. `bin/test` uses nextest when it is installed; CI always
# does (`--profile ci`).
#
# nextest runs every test in its own process, and tests from different binaries
# run at the same time. `cargo test` ran one binary at a time, so cross-binary
# isolation used to come free; here it has to be declared.

[profile.default]
# A test past 60 s is reported as slow; past 5 min it is killed. The real-DB
# tests poll to deadlines measured in seconds — a hang is a bug, not a wait.
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false

# `client_registry_real_db` fills the shared `oauth_clients` table to the 10k
# registration cap, so any concurrent registration — in that binary or any
# other — is refused and flakes. `#[serial]` only serialised the binary's own
# tests inside one process; claiming every slot runs each of them alone.
[[profile.default.overrides]]
filter = "binary(client_registry_real_db)"
threads-required = "num-test-threads"

[profile.ci]
retries = 0
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
