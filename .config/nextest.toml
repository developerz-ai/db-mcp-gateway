# cargo-nextest config. `bin/test` uses nextest when it is installed; CI always
# does (`--profile ci`).
#
# nextest runs every test in its own process, and tests from different binaries
# run at the same time. Two consequences for this repo's integration tests:
# `#[serial]` (an in-process lock) no longer serialises anything, and binaries
# sharing the state DB / MySQL store / target DBs truncate each other's rows.
# So every integration-test binary is in one group that runs one test at a
# time — the isolation `cargo test` gave for free. Unit tests stay parallel.

[profile.default]
# A test past 60 s is reported as slow; past 5 min it is killed. The real-DB
# tests poll to deadlines measured in seconds — a hang is a bug, not a wait.
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false

[test-groups]
shared-db = { max-threads = 1 }

[[profile.default.overrides]]
filter = "kind(test)"
test-group = "shared-db"

[profile.ci]
retries = 0
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
