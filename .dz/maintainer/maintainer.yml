# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy: developerz-ai/db-mcp-gateway
#
# AI-maintained: the agent triages, answers, reviews, closes what has stalled and merges on green.
# A merge here can reach a running deployment, so see `auto_merge_scope` under `pr:`.
version: 1

# No `services:`: this repo brings its own. `bin/test` starts `docker-compose.dev.yml` itself (state
# DB on 127.0.0.1:5433, target DB on :5434), and a box needs only `docker`. Declaring `postgres` held
# the work for a box with a Postgres already accepting, which no box in the fleet advertises, so a
# coding task waited forever as `no_service_capacity`.

tone:
  voice: friendly
  language: en

triage:
  ask_for_repro: true
  required_fields: [steps, expected, actual, version]
  qualify_into: [bug, feature, dupe, question, docs]
  close_unanswered_repro_after_days: 14
  stale_after_days: 30
  stale_action: comment_then_close
  non_goals:
    - "DB credentials leaving the gateway: in responses, logs, errors or admin endpoints"
    - "Best-effort audit: an audit write that fails must fail the request"
    - "A DB call that does not trace to an SSO-verified identity"
    - "The gateway provisioning write grants, or anything that drops read-only as the default"
    - "An in-band admin UI"
    - "Outside human contributors' changes to CI, release or publish automation (.github/, bin/, Dockerfile): members own that pipeline"

handoff:
  mode: fleet
  ask_reporter_first: false

pr:
  wait_for_other_bots: [coderabbit]
  # Named so the agent knows which red check is the author's to fix. Re-check against the
  # repo's ruleset and `.github/workflows/` when either changes; this list is not the ruleset.
  required_checks:
    - "fmt"
    - "clippy"
    - "test"
    - "audit"
  auto_merge: true
  # The bot's own and the dependency bots' merge on green; an outside contributor's PR waits.
  auto_merge_scope: own_and_dependency_bots
  require_review: true
  close_awaiting_author_after_days: 21

review:
  force: true # CodeRabbit is active here; without this the native review defers forever

release:
  # `none`: there is no release manager. Empty channels: the agent publishes nothing itself.
  # A `v*` tag runs release.yml, which builds and pushes the image. See `.dz/briefs/release-due.md`.
  manager: none
  channels: []

escalate:
  # Empty: nothing beyond the platform's hardcoded asks (security, license, CLA).
  ask_before_acting: []

schedules:
  # Weekly and judged, so a merge never cuts a release (owner, 2026-11-01: "no auto, not dependabot,
  # us developerz.ai AI decides if needed"). One weekday per repo, so the fleet is not hit at once.
  - name: release-due
    days: [mon]
    hours_utc: [3]
    brief_file: .dz/briefs/release-due.md
  # The one exception, so a confirmed security fix does not wait up to a week for the slot above.
  - name: security-release
    days: [tue, wed, thu, fri, sat, sun]
    hours_utc: [6]
    brief_file: .dz/briefs/security-release.md
  - name: health
    days: [mon, tue, wed, thu, fri, sat, sun]
    hours_utc: [7]
    brief_file: .dz/briefs/health.md
  - name: improve
    days: [mon]
    hours_utc: [8]
    brief_file: .dz/briefs/improve.md
