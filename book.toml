# mdBook config for the in-site docs at /docs/ (served under GitHub Pages).
# The landing page (docs/site/index.html) is generated by hand; this book is
# generated by mdBook and lives at docs/site/docs/ so the deploy artifact
# ships both under a single tree.

[book]
title = "db-mcp-gateway"
description = "Self-hosted MCP gateway for AI agents that need database access — without ever handing out a database URL."
authors = ["developerz-ai"]
language = "en"
src = "docs"
# SUMMARY.md gates *rendering* only. mdBook still recursive-copies every
# non-.md asset under src (= docs/) into build-dir. The Pages workflow
# strips known offenders (docs/site/, docs/sec/) and fails on unexpected
# sensitive/config assets before uploading. See docs/initial-idea/13-docs-site.md.

[build]
build-dir = "docs/site/docs"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/developerz-ai/db-mcp-gateway"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/developerz-ai/db-mcp-gateway/edit/main/docs/{path}"
site-url = "/db-mcp-gateway/docs/"
no-section-label = true
# Palette + typography override that matches the landing page (docs/site/index.html).
# theme/ lives outside src (= docs/), so it isn't touched by mdBook's recursive-copy.
additional-css = ["theme/db-mcp-overrides.css"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30

[output.html.fold]
enable = true
level = 1
