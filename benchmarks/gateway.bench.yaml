# Gateway config used by the benchmark harness.
#
# Points at the local dev stack (`bin/dev up`). Every value here is a
# development credential that is already public in docker-compose.dev.yml — no
# real secret belongs in this file, and the harness never runs against a real
# target.
#
# Constraints are set deliberately WIDE: the point is to measure the gateway's
# own overhead, not to measure it hitting a row cap or a statement timeout. A
# truncated response would make the gateway and direct paths incomparable.
#
# Every query target lives in this one file so a single config serves every
# backend: `--backend postgres` measures the `target` server, `--backend
# postgres-write` the `target-write` server, `--backend mongo` the `mongo`
# server. Adapters open lazily, so declaring both costs
# nothing on a run that only uses one.

servers:
  - name: target
    kind: postgres
    description: Local dev target-db (docker-compose.dev.yml)
    host: localhost
    port: 5434
    tls: insecure
    databases:
      - name: app
        role: app
        password: app-dev-only
        description: Benchmark target

  # The same target-db, declared a second time with a write tier, so the read
  # benchmark keeps its `query_read` grant on `target` untouched. Writes run as
  # `write_role` (`app`, the role the direct baseline uses too); the read tier
  # needs a different role, `bench_ro`, which the harness creates with no
  # privileges beyond the database defaults — the write benchmark never reads.
  - name: target-write
    kind: postgres
    description: Local dev target-db, write tier (docker-compose.dev.yml)
    host: localhost
    port: 5434
    tls: insecure
    databases:
      - name: app
        role: bench_ro
        password: bench-ro-dev-only
        write_role: app
        write_password: app-dev-only
        description: Write benchmark target (scratch table bench_writes)

  - name: mongo
    kind: mongo
    description: Local dev target-mongo (docker-compose.dev.yml)
    host: localhost
    port: 27018
    tls: insecure
    databases:
      - name: app
        role: app
        password: app-dev-only
        # The container's bootstrap user lives in `admin` — see
        # docker-compose.dev.yml `target-mongo`.
        auth_database: admin
        description: Benchmark target

permissions:
  # The benchmark service account acts as exactly this group.
  - group: svc-bench
    grants:
      - server: target
        database: app
        action: query_read
        constraints:
          # Above the 1000 rows the range-scan shape returns, so nothing is
          # truncated. Below it, the two paths would return different data.
          row_limit: 5000
          # Generous: a timeout would turn a slow sample into an error and
          # quietly remove the tail we are trying to measure.
          statement_timeout_ms: 30000
          # Off — a required reason adds a field to every request and would
          # measure our own test scaffolding.
          require_reason: false

      # The write benchmark: one UPDATE ... RETURNING per request on the
      # write tier. Same wide constraints as the read grants.
      - server: target-write
        database: app
        action: query_write
        constraints:
          row_limit: 5000
          statement_timeout_ms: 30000
          require_reason: false

      - server: mongo
        database: app
        action: query_read
        constraints:
          # Same reasoning as the postgres grant above: wide enough that the
          # gateway never truncates, so the two paths stay comparable.
          row_limit: 5000
          statement_timeout_ms: 30000
          require_reason: false

service_accounts:
  - name: bench
    group: svc-bench
    token: ${ENV:SERVICE_TOKEN_BENCH}
