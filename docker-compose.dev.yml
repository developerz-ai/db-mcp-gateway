# Local dev stack. Not for production — see docs/deployment/quickstart.md for that.
# Brought up by `bin/dev up`. Reads env from .env.

services:
  state-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${STATE_DB_USER:-gateway}
      POSTGRES_PASSWORD: ${STATE_DB_PASSWORD:-gateway-dev-only}
      POSTGRES_DB: ${STATE_DB_NAME:-gateway}
    ports:
      # Bind to localhost only. These are local dev databases and must never be
      # reachable off-box: a host-wide (0.0.0.0) publish on a public-IP dev host
      # exposes Postgres to internet scanners — and Docker publishes ports via its
      # own iptables chain that bypasses UFW, so a host firewall won't save you.
      - "127.0.0.1:${STATE_DB_PORT:-5433}:5432"
    volumes:
      - state-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STATE_DB_USER:-gateway}"]
      interval: 3s
      timeout: 3s
      retries: 10

  target-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TARGET_DB_USER:-app}
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD:-app-dev-only}
      POSTGRES_DB: ${TARGET_DB_NAME:-app}
    ports:
      # Bind to localhost only (see state-db above).
      - "127.0.0.1:${TARGET_DB_PORT:-5434}:5432"
    volumes:
      - target-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TARGET_DB_USER:-app}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Mysql permissions store for #59. Optional — only opened when
  # `permissions_store.driver = mysql` in YAML. State DB itself stays pg.
  permissions-mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${PERMISSIONS_MYSQL_ROOT_PASSWORD:-mysql-dev-only}
      MYSQL_DATABASE: ${PERMISSIONS_MYSQL_DB:-permissions}
      MYSQL_USER: ${PERMISSIONS_MYSQL_USER:-permissions}
      MYSQL_PASSWORD: ${PERMISSIONS_MYSQL_PASSWORD:-permissions-dev-only}
    ports:
      - "${PERMISSIONS_MYSQL_PORT:-3307}:3306"
    volumes:
      - permissions-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Mongo target for #58 integration tests. The root user is what tests
  # connect as — production deployments wire a least-privilege read role
  # via spec 05; for the dev stack we lean on the rejector as the gateway
  # guardrail and keep the container's auth bootstrap simple.
  target-mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${TARGET_MONGO_USER:-app}
      MONGO_INITDB_ROOT_PASSWORD: ${TARGET_MONGO_PASSWORD:-app-dev-only}
      MONGO_INITDB_DATABASE: ${TARGET_MONGO_DB:-app}
    ports:
      - "${TARGET_MONGO_PORT:-27018}:27017"
    volumes:
      - target-mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  state-db-data:
  target-db-data:
  target-mongo-data:
  permissions-mysql-data:
