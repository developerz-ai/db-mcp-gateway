# Local dev stack. Not for production — see docs/deployment/quickstart.md for that.
# Brought up by `bin/dev up`. Reads env from .env.

services:
  state-db:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_USER: ${STATE_DB_USER:-gateway}
      POSTGRES_PASSWORD: ${STATE_DB_PASSWORD:-gateway-dev-only}
      POSTGRES_DB: ${STATE_DB_NAME:-gateway}
    ports:
      # Bind to localhost only. These are local dev databases and must never be
      # reachable off-box: a host-wide (0.0.0.0) publish on a public-IP dev host
      # exposes Postgres to internet scanners — and Docker publishes ports via its
      # own iptables chain that bypasses UFW, so a host firewall won't save you.
      - "127.0.0.1:${STATE_DB_PORT:-5433}:5432"
    volumes:
      - state-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STATE_DB_USER:-gateway}"]
      interval: 3s
      timeout: 3s
      retries: 10

  target-db:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_USER: ${TARGET_DB_USER:-app}
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD:-app-dev-only}
      POSTGRES_DB: ${TARGET_DB_NAME:-app}
    ports:
      # Bind to localhost only (see state-db above).
      - "127.0.0.1:${TARGET_DB_PORT:-5434}:5432"
    volumes:
      - target-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TARGET_DB_USER:-app}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Scratch Postgres and a transaction-mode PgBouncer for the pooled-backend
  # regression in pg_unnamed_statements_real_db.rs. Separate from `target-db`
  # so its prepared-statement state is never shared with the other suites.
  # No volume: each `up` starts a fresh backend.
  target-pool-db:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_USER: ${TARGET_DB_USER:-app}
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD:-app-dev-only}
      POSTGRES_DB: ${TARGET_DB_NAME:-app}
      # Postgres 16 defaults to SCRAM; the pooler's userlist uses md5.
      POSTGRES_INITDB_ARGS: --auth-host=md5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TARGET_DB_USER:-app}"]
      interval: 3s
      timeout: 3s
      retries: 10

  target-pooler:
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:8638aa563607256d3c7440437534195f1066a92b68015d89ae9d6b935b444a6d
    depends_on:
      target-pool-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${TARGET_DB_USER:-app}:${TARGET_DB_PASSWORD:-app-dev-only}@target-pool-db:5432/${TARGET_DB_NAME:-app}
      AUTH_TYPE: md5
      LISTEN_PORT: 6432
      ADMIN_USERS: ${TARGET_DB_USER:-app}
      POOL_MODE: transaction
      # Two server connections: one for the gateway's single client
      # connection, one for the test's observer that cancels the read. The
      # gateway still reuses the same backend across its own reads.
      DEFAULT_POOL_SIZE: 2
      MAX_CLIENT_CONN: 10
      TARGET_DB_USER: ${TARGET_DB_USER:-app}
      TARGET_DB_PASSWORD: ${TARGET_DB_PASSWORD:-app-dev-only}
      # Nothing between two client transactions may clear the backend's
      # prepared statements: the regression must see a leaked named statement
      # exactly as a production transaction pooler would.
      SERVER_RESET_QUERY: ''
    ports:
      # Bind to localhost only (see state-db above).
      - "127.0.0.1:6432:6432"
    healthcheck:
      # PgBouncer's own console answers from the process, not a backend.
      test: ["CMD-SHELL", "PGPASSWORD=\"$$TARGET_DB_PASSWORD\" psql -h 127.0.0.1 -p 6432 -U \"$$TARGET_DB_USER\" -d pgbouncer -tAc 'SHOW POOLS' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Mysql permissions store for #59. Optional — only opened when
  # `permissions_store.driver = mysql` in YAML. State DB itself stays pg.
  permissions-mysql:
    image: mysql:8@sha256:8c233bad33d520a7aae1c1e619c3a9775f4a1ba2d463d692fada04ec7f40be00
    environment:
      MYSQL_ROOT_PASSWORD: ${PERMISSIONS_MYSQL_ROOT_PASSWORD:-mysql-dev-only}
      MYSQL_DATABASE: ${PERMISSIONS_MYSQL_DB:-permissions}
      MYSQL_USER: ${PERMISSIONS_MYSQL_USER:-permissions}
      MYSQL_PASSWORD: ${PERMISSIONS_MYSQL_PASSWORD:-permissions-dev-only}
    ports:
      # Bind to localhost only (see state-db above).
      - "127.0.0.1:${PERMISSIONS_MYSQL_PORT:-3307}:3306"
    volumes:
      - permissions-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Mongo target for #58 integration tests. The root user is what tests
  # connect as — production deployments wire a least-privilege read role
  # via spec 05; for the dev stack we lean on the rejector as the gateway
  # guardrail and keep the container's auth bootstrap simple.
  target-mongo:
    image: mongo:7@sha256:41e8195b2791692695e1dc9bd21cd51d0a3af05fff8ace9304a5c1acf94f1ae1
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${TARGET_MONGO_USER:-app}
      MONGO_INITDB_ROOT_PASSWORD: ${TARGET_MONGO_PASSWORD:-app-dev-only}
      MONGO_INITDB_DATABASE: ${TARGET_MONGO_DB:-app}
    ports:
      # Bind to localhost only (see state-db above).
      - "127.0.0.1:${TARGET_MONGO_PORT:-27018}:27017"
    volumes:
      - target-mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 3s
      timeout: 3s
      retries: 20

  # Redis target (kind: redis). `requirepass` sets the `default` superuser,
  # which the gateway refuses as a role; tests create a least-privilege ACL
  # user (`+@read`, key-scoped) through it, as an operator would.
  target-redis:
    image: redis:8.4-alpine@sha256:ff72f74e4f471df79ed920aa8bbc35efe72ff8a1f8acdc50aad5dbb9b14a4034
    command: ["redis-server", "--requirepass", "${TARGET_REDIS_PASSWORD:-redis-dev-only}", "--save", "", "--appendonly", "no"]
    ports:
      # Bind to localhost only (see state-db above).
      - "127.0.0.1:${TARGET_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${TARGET_REDIS_PASSWORD:-redis-dev-only}

  # Dragonfly target: Redis-protocol compatible, the same `kind: redis`.
  # The same Redis suite runs against it so a protocol difference fails CI.
  target-dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0@sha256:0fa01a2b929e704c7a9300d23e7f52002ebd39e90996fb8bb63826aed92fa06f
    command: ["dragonfly", "--requirepass=${TARGET_DRAGONFLY_PASSWORD:-dragonfly-dev-only}", "--maxmemory=512mb", "--proactor_threads=2", "--dbfilename="]
    ulimits:
      memlock: -1
    ports:
      # Bind to localhost only (see state-db above).
      - "127.0.0.1:${TARGET_DRAGONFLY_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$DF_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      DF_PASSWORD: ${TARGET_DRAGONFLY_PASSWORD:-dragonfly-dev-only}

  # YugabyteDB (YSQL) target: Postgres wire protocol, served as `kind: postgres`.
  # The Postgres query-path suite runs against it (`bin/test-yugabyte`) so a
  # change that breaks it fails CI. Behind the `yugabyte` profile — `bin/dev up`
  # and `bin/test` never start it. Pinned to the version production runs.
  # No volume: yugabyted pins its node to the container address, which changes
  # on recreate, so every boot is a fresh single-node cluster. The script
  # mirrors target-db's bootstrap (POSTGRES_USER is a superuser owning `app`)
  # with password auth on, then waits on yugabyted so its exit stops the
  # container.
  target-yugabyte:
    image: yugabytedb/yugabyte:2.25.2.0-b359@sha256:f1b868431c9f71013f451df8cc63c59886568bb1254e4cb6f98de14d0232a3ad
    profiles: ["yugabyte"]
    # Docker's default 10 s grace SIGKILLs tablets mid-flush; the WAL then
    # comes back without its footer and writes time out until the volume is
    # recreated. `stop`/`down` without `-t` use this value. It buys a clean
    # stop only because the command traps SIGTERM and stops the servers itself
    # (`stop_yb`), about 10 s: passing it to yugabyted would SIGKILL them.
    stop_grace_period: 120s
    environment:
      YB_APP_USER: ${TARGET_DB_USER:-app}
      YB_APP_PASSWORD: ${TARGET_DB_PASSWORD:-app-dev-only}
      YB_APP_DB: ${TARGET_DB_NAME:-app}
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        addr=$$(hostname -i | awk '{print $$1}')
        # Its own session: yugabyted answers SIGTERM by SIGKILLing its process
        # group, which must not be this shell's.
        setsid bin/yugabyted start --background=false --ui=false \
          --advertise_address="$$addr" \
          --tserver_flags="ysql_enable_auth=true" &
        yb=$$!
        # Stop the servers first, so they flush and exit on their own, then
        # yugabyted, which removes its pid file (a stale one fails the restart).
        stop_yb() {
          for name in yb-tserver yb-master; do
            pid=$$(pgrep -x "$$name" || true)
            [ -n "$$pid" ] || continue
            kill -TERM "$$pid" || true
            while kill -0 "$$pid" 2>/dev/null; do sleep 0.2; done
          done
          kill -TERM "$$yb" 2>/dev/null || true
          wait "$$yb" || true
          exit 0
        }
        trap stop_yb TERM
        export PGPASSWORD=yugabyte
        until bin/ysqlsh -h "$$addr" -U yugabyte -d yugabyte -tAc 'SELECT 1' >/dev/null 2>&1; do
          kill -0 "$$yb" 2>/dev/null || exit 1
          sleep 1
        done
        bin/ysqlsh -h "$$addr" -U yugabyte -d yugabyte -v ON_ERROR_STOP=1 \
          -v user="$$YB_APP_USER" -v pass="$$YB_APP_PASSWORD" -v db="$$YB_APP_DB" <<'SQL'
        SELECT format('CREATE ROLE %I SUPERUSER LOGIN PASSWORD %L', :'user', :'pass')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'user') \gexec
        SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'user')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db') \gexec
        SQL
        touch /tmp/fixtures-ready
        wait "$$yb"
    ports:
      # Bind to localhost only (see state-db above). Not 5433: state-db holds it.
      - "127.0.0.1:${TARGET_YB_PORT:-5435}:5433"
    healthcheck:
      # Ready only once YSQL answers as the fixture role in its database.
      test: ["CMD-SHELL", "test -f /tmp/fixtures-ready && PGPASSWORD=\"$$YB_APP_PASSWORD\" bin/ysqlsh -h \"$$(hostname -i | awk '{print $$1}')\" -U \"$$YB_APP_USER\" -d \"$$YB_APP_DB\" -tAc 'SELECT 1' | grep -qx 1"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 120s

  # Dev-only OIDC IdP for the SSO path (`bin/run --idp`), at the OIDC_ISSUER
  # .env.example sets. Static user dev@example.com / dev-only-password in group
  # `devs` (config/dex.yaml). Behind the `idp` profile — `bin/dev up` and
  # `bin/test` never start it (the tests run their own mock IdP). examples/demo
  # profile `sso` uses the same config and port: run one at a time.
  dex:
    image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    profiles: ["idp"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      # Bind to localhost only (see state-db above). The issuer URL names this port.
      - "127.0.0.1:5556:5556"
    volumes:
      - ./config/dex.yaml:/etc/dex/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5556/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  state-db-data:
  target-db-data:
  target-mongo-data:
  permissions-mysql-data:
